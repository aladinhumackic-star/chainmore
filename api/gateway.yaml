  /v1/dashboard/reconciliation:
    get:
      summary: Search CCTP reconciliation rows for the authenticated merchant (mode-scoped).
      operationId: listDashboardReconciliation
      description: |
        Read-only merchant dashboard projection over payment_intents.
        The required `q` parameter is exact-match support lookup by
        merchant_order_id, customer_reference, or payment-intent ID.
        The repository always derives merchant and mode from auth
        context; `q` never broadens tenant or mode scope.
      parameters:
        - $ref: "#/components/parameters/DashboardLimit"
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
          description: "Required exact lookup by merchant_order_id, customer_reference, or payment-intent ID."
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Reconciliation rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardReconciliationPage" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/reconciliation/recent:
    get:
      summary: List recent CCTP payment-intent evidence for the authenticated merchant.
      operationId: listRecentDashboardReconciliation
      description: |
        Read-only merchant dashboard projection over the most recent
        payment_intents rows. Merchant and mode are resolved from auth
        context; the endpoint is bounded by DashboardLimit and never
        exposes raw CCTP states, proofs, route hashes, attestation bytes,
        checkout token hashes, or cross-tenant rows.
      parameters:
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/CorrelationID"
