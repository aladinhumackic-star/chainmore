# ChainMore Gateway - Public HTTP Surface
#
# Version:  1.0.0-rc1
# Frozen:     2026-04-21  (CKO Checkout Session Closure delivery)
# Re-frozen:  2026-04-26  (post-MerchantAuth-JWT + Merchant-UI cluster
#                          OpenAPI-Drift-Audit sweep - IdempotencyKey
#                          on all 19 mutation endpoints, BadRequest
#                          response on every Idempotency-required path,
#                          N3 cross-merchant asymmetry documented in
#                          info.description, MerchantAuth-JWT codes
#                          jwt_invalid / jwt_expired / membership_missing
#                          merged, IDX webhook codes
#                          replay_of_test_event_forbidden,
#                          delivery_endpoint_mismatch,
#                          endpoint_secret_missing_envelope merged.
#                          F-UI-6 follow-up (same day): wrong_auth_kind
#                          split out of jwt_invalid for credential-kind
#                          mismatches caught at the dispatcher boundary.)
# Scope:    all routes mounted by internal/gateway/server.go.
#           Authoritative manifest lives in internal/gateway/routes.go;
#           cmd/openapi-drift-check --service gateway enforces spec↔code agreement.
# Non-goals: SDK generation, wallet-signing payload formats (owned by the
#            checkout-web frontend contract), long-polling streams.
#
# Semver contract:
#   MAJOR - breaking change to path, method, or required field.
#   MINOR - additive field, new optional query param, new endpoint.
#   PATCH - bugfix, docs clarification, non-behavioral schema tightening.
#
# Invariants enforced by this surface (cross-referenced in per-route descriptions):
#   REC-I1   - Route Engine must be a productive consumer on /v1/routing/plan
#   PFV-I1   - Pre-Flight Validation must be productive on /v1/validation/validate
#   DISP-I1  - Dispatcher gate must be productive on /v1/dispatch/decide
#   EXE-GATE-I1 - /v1/payments/{id}/attempts refuses without a wired gate
#   CKO-I1   - Session-Is-Truth: hosted checkout routes read/write through
#              internal/checkout, never directly against operator-only rows.
#   CKO-I2   - Transitions-Are-Guarded: every mutation passes through the
#              state machine in internal/domain/checkout.go.
#   CKO-I3   - Call-Matches-State: handlers reject calls whose required
#              current state is not met (409 invalid_state).
#   CKO-I4   - Token-Hash-Indexed: /v1/checkout/sessions/by-token hashes
#              the raw token server-side; no raw token ever hits storage.
#   N3       - Cross-merchant asymmetry by bearer kind (deliberately
#              accepted): API-key path returns 404, JWT path returns 403
#              cross_merchant_forbidden. See info.description for the
#              full statement and ADR_MERCHANT_AUTH_JWT.md section Deliberately
#              Accepted Asymmetry.
#   N6       - Access tokens only on the JWT path: ID tokens are
#              rejected via the audience check. See
#              ADR_MERCHANT_AUTH_JWT.md.
#
openapi: 3.1.0
info:
  title: ChainMore Gateway API
  version: 1.0.0-rc1
  description: |
    Public HTTP surface for the ChainMore payment platform.

    **Audience:** merchant backends (payment creation, webhook correlation) and
    the hosted-checkout frontend (wallet binding, route selection, submit).
    The gateway is the ONLY public API ingress for merchant payment flows
    (routing -> validation -> dispatch -> execution). Internal operator surfaces
    are not served from the public documentation site.

    **Error envelope:** every non-2xx response uses RFC 7807 `application/problem+json`
    with the shape defined by `#/components/schemas/Problem`. The `code` field
    carries a stable machine-readable identifier; new codes are additive.

    **Cross-merchant access (N3 asymmetry):** this surface accepts two
    bearer kinds - server API keys (`cm_test_...` / `cm_live_...`) and OIDC
    JWTs (Keycloak access tokens carrying `aud=chainmore-gateway`).
    A request that authenticates successfully but targets a resource
    owned by a *different* merchant is treated differently per bearer
    kind, by deliberate design:

      - **API-key path:** returns `404 not_found`. The server-to-server
        contract treats "resource does not exist in your scope" as a
        valid machine-facing semantic; surfacing the cross-merchant
        distinction would leak the existence of resources owned by
        other tenants.
      - **JWT path:** returns `403 cross_merchant_forbidden`. The
        merchant-user-in-UI flow benefits from an explicit message -
        a confused user who clicked into the wrong tenant's bookmarked
        URL gets an actionable response rather than a misleading 404.

    Merchant integrations using the API-key path should therefore
    handle 404 as the canonical "wrong merchant or genuinely missing"
    signal. The same logical condition surfaces as 403 only on the
    OIDC JWT path used by the merchant dashboard frontend.

    **Credential-kind mismatch (`wrong_auth_kind`):** the gateway's
    auth dispatcher rejects requests where the bearer SHAPE doesn't
    match the route's auth class - an API key (`cm_test_...` /
    `cm_live_...`) on a control-plane (JWT-only) route, or a JWT on a
    machine (API-key-only) route. This refusal lands on
    `401 wrong_auth_kind` and is distinct from `jwt_invalid`: the
    latter means "the bearer was presented as a JWT but failed
    signature / issuer / audience validation"; `wrong_auth_kind`
    means "you sent the wrong credential kind for this surface".
    The webhook test endpoint
    (`POST /v1/webhook_endpoints/{id}/test`) is the single
    dual-auth route that accepts either kind.

    **Which credential an endpoint takes:** each operation lists its
    security scheme. `bearerAuth` is the merchant API key for your
    server. `dashboardSession` is the login token of the merchant
    dashboard; endpoints with this scheme serve the dashboard and
    refuse an API key. Endpoints with `security: []` or a checkout
    token scheme take no merchant credential. They are public, or they
    check a checkout token or a provider signature as their
    description says.

    **Idempotency:** every POST, PUT, PATCH, and DELETE request MUST
    include an `Idempotency-Key` header. A missing or empty key returns
    `400 idempotency_required`; the gateway checks the header before it
    checks the credential. Generate one key per logical operation (for
    example per click on Submit) and reuse it when you retry that
    operation. The one exception is the Paysafe provider callback
    (`POST /internal/providers/paysafe/webhooks`), which is signed by
    the provider instead.
  contact:
    name: ChainMore
    url: https://chainmore.io
  license:
    name: Proprietary

servers:
  - url: https://api.chainmore.io
    description: Gateway API. Test or live mode is selected by your credentials.
  - url: http://localhost:8080
    description: Local development

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    checkoutSessionToken:
      type: http
      scheme: bearer
      description: Short-lived checkout session token; preferred over the query fallback.
    checkoutSessionTokenQuery:
      type: apiKey
      in: query
      name: token
      description: Checkout token fallback. Bearer takes precedence when both are present.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: cm_{mode}_{hex}
      description: |
        Merchant API key, sent from your server as `Authorization: Bearer
        cm_test_<hex>` (test mode) or `Authorization: Bearer
        cm_live_<hex>` (live mode). Endpoints with this scheme accept
        only a merchant API key; a dashboard login token returns
        `401 wrong_auth_kind`. Endpoints marked `security: []` need no
        merchant credential.

        IDX-I2: the key sets the mode (test or live). The gateway never
        reads the mode from a body, header, or query field. A mode sent
        on the request is ignored.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Login token of the merchant dashboard. Endpoints with this scheme
        are used by the dashboard and cannot be called with a merchant
        API key. An API key returns `401 wrong_auth_kind`. The gateway
        takes the mode (test or live) from the dashboard's mode selection
        (`/v1/dashboard/mode-selection`), never from the request. Without
        approved live access the mode is always test.

  parameters:
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Client-supplied correlation ID for request tracing. If absent,
        the gateway generates one and echoes it on the response. Always
        present in error envelopes for log joining.
      schema: { type: string, minLength: 1, maxLength: 128 }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every POST, PUT, PATCH and DELETE. Reuse the same key
        when you retry the same request; a missing key returns 400
        idempotency_required.
      schema: { type: string, minLength: 1, maxLength: 128 }

    PaymentID:
      name: id
      in: path
      required: true
      description: Payment aggregate identifier (ULID-shaped `pay_...`).
      schema: { type: string, minLength: 1, maxLength: 128 }

    AttemptID:
      name: aid
      in: path
      required: true
      description: Payment-attempt identifier (ULID-shaped `att_...`).
      schema: { type: string, minLength: 1, maxLength: 128 }

    CheckoutPaymentID:
      name: payment_id
      in: path
      required: true
      description: Payment ID the checkout session is bound to.
      schema: { type: string, minLength: 1, maxLength: 128 }

    CheckoutToken:
      name: token
      in: path
      required: true
      description: |
        Raw checkout token issued by `InitSession`. The gateway hashes
        it server-side and looks up the session by the hash (CKO-I4);
        the raw token is never persisted.
      schema: { type: string, minLength: 1, maxLength: 256 }

    DecisionID:
      name: id
      in: path
      required: true
      description: Opaque decision identifier (ULID-shaped).
      schema: { type: string, minLength: 1, maxLength: 128 }

    APIKeyID:
      name: id
      in: path
      required: true
      description: Merchant API-key identifier (UUID-shaped `ak_...`).
      schema: { type: string, minLength: 1, maxLength: 128 }

    WebhookEndpointID:
      name: id
      in: path
      required: true
      description: Webhook endpoint identifier (UUID-shaped `wh_...`).
      schema: { type: string, minLength: 1, maxLength: 128 }

    DashboardPaymentID:
      name: id
      in: path
      required: true
      description: Payment aggregate identifier used by the dashboard read plane.
      schema: { type: string, minLength: 1, maxLength: 128 }

    DashboardSessionID:
      name: id
      in: path
      required: true
      description: Checkout session identifier used by the dashboard read plane.
      schema: { type: string, minLength: 1, maxLength: 128 }

    DashboardExportID:
      name: id
      in: path
      required: true
      description: Async dashboard export job UUID.
      schema: { type: string, format: uuid }

    DashboardCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque pagination cursor as returned by the previous page's
        `next_cursor` field. Omit on the first page.
      schema: { type: string, maxLength: 256 }

    DashboardLimit:
      name: limit
      in: query
      required: false
      description: |
        Maximum rows to return. Server-clamped to the dashboard-tier
        default if absent or out of range.
      schema: { type: integer, minimum: 1, maximum: 200 }

    DashboardPaymentSearch:
      name: q
      in: query
      required: false
      description: Exact lookup by merchant_order_id or ChainMore payment_id.
      schema: { type: string, maxLength: 128 }

    DashboardPaymentStatus:
      name: status
      in: query
      required: false
      description: Merchant-facing payment status filter.
      schema:
        type: string
        enum:
          - payment_created
          - checkout_started
          - authorization_pending
          - authorized
          - executing
          - completed
          - failed
          - expired

    DashboardPaymentCreatedFrom:
      name: created_from
      in: query
      required: false
      description: Inclusive created_at lower bound. Accepts YYYY-MM-DD or RFC3339.
      schema: { type: string }

    DashboardPaymentCreatedTo:
      name: created_to
      in: query
      required: false
      description: Exclusive created_at upper bound. YYYY-MM-DD values include that calendar day.
      schema: { type: string }

    DashboardExportLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows to include in the CSV export. Server-clamped to 5000.
      schema: { type: integer, minimum: 1, maximum: 5000 }

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    StablecoinDecisionWallet:
      type: object
      additionalProperties: false
      required: [address, chain_id]
      properties:
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        chain_id: { type: integer, minimum: 1, maximum: 9007199254740991 }

    StablecoinDecisionQuote:
      description: |
        Displayed terms, submitted unchanged for revalidation. No signature
        or execution authority. USDT and USDC are not converted into each
        other. Amount strings are atomic units. Each route carries exactly
        its own fields:
        - `native`: paid on the wallet's chain through the rail's adapter;
        - `oft`: the USDT0 corridor, paid on Ethereum and received on
          Arbitrum after `delivery_seconds`;
        - `cctp_forward`: USDC across networks through Circle's standard
          forwarding. Its delivery time is unconfirmed: no
          `delivery_seconds`; `delivery_estimate_seconds`, when present, is
          a non-binding estimate (about this long, it can take longer),
          never a maximum. It is confirmed from its source network
          (`chain_id`): the wallet switches there first.
      oneOf:
        - $ref: "#/components/schemas/StablecoinDecisionQuoteNative"
        - $ref: "#/components/schemas/StablecoinDecisionQuoteOFT"
        - $ref: "#/components/schemas/StablecoinDecisionQuoteForward"
      discriminator:
        propertyName: route
        mapping:
          native: "#/components/schemas/StablecoinDecisionQuoteNative"
          oft: "#/components/schemas/StablecoinDecisionQuoteOFT"
          cctp_forward: "#/components/schemas/StablecoinDecisionQuoteForward"

    StablecoinDecisionQuoteNative:
      type: object
      additionalProperties: false
      description: |
        A native route. With the merchant's fee terms it names them:
        `fee_terms_id` and `native_fee_terms`.
      required: [id, payment_method, asset, chain_id, network, token, recipient,
        route, merchant_atomic, fee_atomic, gross_atomic, native_fee_atomic,
        native_currency, native_decimals, wallet_actions, gas_financed, expires_at, snapshot]
      properties:
        route: { type: string, const: native }
        payment_method: { type: string, enum: [usdt0, usdc] }
        asset: { type: string, enum: [USDT, USDC] }
        issuer:
          type: string
          description: |
            Who issues the token when that is not the usual issuer of its
            symbol, so the token is never equated with another by its
            symbol: `binance` for USDT on BNB Chain (chain 56). Absent
            otherwise.
        adapter: { type: string }
        adapter_version: { type: integer }
        fee_recipient: { type: string }
        fee_terms_id: { type: string }
        native_fee_terms:
          type: object
          additionalProperties: false
          required: [merchant_id, mode, version, fee_payer, bps, minimum_minor]
          properties:
            merchant_id: { type: string }
            mode: { type: string, enum: [test, live] }
            version: { type: string }
            fee_payer: { type: string, enum: [buyer, merchant] }
            bps: { type: integer, minimum: 0, maximum: 10000 }
            minimum_minor: { type: integer, minimum: 0 }
        terms_signature: { type: boolean }
        id: { type: string }
        chain_id: { type: integer, minimum: 1 }
        network: { type: string }
        token: { type: string }
        recipient: { type: string }
        merchant_atomic: { type: string, pattern: '^[0-9]+$' }
        fee_atomic: { type: string, pattern: '^[0-9]+$' }
        gross_atomic: { type: string, pattern: '^[0-9]+$' }
        native_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        approval_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        payment_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        native_currency: { type: string }
        native_decimals: { type: integer }
        total_usd_atomic: { type: string, pattern: '^[0-9]+$' }
        wallet_actions: { type: integer }
        gas_financed: { type: boolean }
        expires_at: { type: string, format: date-time }
        snapshot: { type: string }

    StablecoinDecisionQuoteOFT:
      type: object
      additionalProperties: false
      description: The USDT0 corridor; delivered on Arbitrum after `delivery_seconds`.
      required: [id, payment_method, asset, chain_id, network, token, recipient,
        route, merchant_atomic, fee_atomic, gross_atomic, native_fee_atomic,
        native_currency, native_decimals, wallet_actions, gas_financed, expires_at, snapshot,
        destination_chain_id, destination_network, delivery_seconds]
      properties:
        route: { type: string, const: oft }
        payment_method: { type: string, const: usdt0 }
        asset: { type: string, const: USDT }
        issuer:
          type: string
          description: |
            Who issues the token when that is not the usual issuer of its
            symbol, so the token is never equated with another by its
            symbol: `binance` for USDT on BNB Chain (chain 56). Absent
            otherwise.
        adapter: { type: string }
        destination_chain_id: { type: integer, minimum: 1 }
        destination_network: { type: string }
        delivery_seconds: { type: integer, minimum: 1 }
        id: { type: string }
        chain_id: { type: integer, minimum: 1 }
        network: { type: string }
        token: { type: string }
        recipient: { type: string }
        merchant_atomic: { type: string, pattern: '^[0-9]+$' }
        fee_atomic: { type: string, pattern: '^[0-9]+$' }
        gross_atomic: { type: string, pattern: '^[0-9]+$' }
        native_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        approval_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        payment_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        native_currency: { type: string }
        native_decimals: { type: integer }
        total_usd_atomic: { type: string, pattern: '^[0-9]+$' }
        wallet_actions: { type: integer }
        gas_financed: { type: boolean }
        expires_at: { type: string, format: date-time }
        snapshot: { type: string }

    StablecoinDecisionQuoteForward:
      type: object
      additionalProperties: false
      description: |
        USDC across networks through Circle's standard forwarding, paid by
        the customer's own gas. Delivery is unconfirmed; see
        `StablecoinDecisionQuote`.
      required: [id, payment_method, asset, chain_id, network, token, recipient,
        route, merchant_atomic, fee_atomic, gross_atomic, native_fee_atomic,
        native_currency, native_decimals, wallet_actions, gas_financed, expires_at, snapshot,
        adapter, adapter_version, fee_recipient, source_chain, dest_chain,
        destination_chain_id, destination_network, circle_fee_atomic,
        chainmore_fee_atomic, fee_terms_id, delivery_unconfirmed]
      properties:
        route: { type: string, const: cctp_forward }
        payment_method: { type: string, const: usdc }
        asset: { type: string, const: USDC }
        adapter: { type: string }
        adapter_version: { type: integer, const: 3 }
        fee_recipient: { type: string }
        source_chain: { type: string }
        dest_chain: { type: string }
        destination_chain_id: { type: integer, minimum: 1 }
        destination_network: { type: string }
        circle_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        circle_fee_max_atomic:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Only on the checkout-link discovery of a page that declared the
            capability `forward_circle_fee_max_v1`: the most Circle's fee may
            be, the estimate `circle_fee_atomic` plus 1000 (0.001 USDC). The
            customer accepts it with `accepted_circle_fee_max_atomic` on the
            checkout-link select; the payment carries the actual fee of
            Circle's binding quote, never this maximum, and refuses above it.
        gross_max_atomic:
          type: string
          pattern: '^[0-9]+$'
          description: |
            With `circle_fee_max_atomic` only: the most the wallet's token
            debit may be, `merchant_atomic` plus `chainmore_fee_atomic` plus
            `circle_fee_max_atomic`. The network fee is not part of it;
            `total_usd_atomic` stays an estimate.
        chainmore_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        fee_terms_id: { type: string }
        delivery_unconfirmed: { type: boolean, const: true }
        delivery_estimate_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Non-binding estimate in seconds; about this long, it can take longer. Never a maximum.
        id: { type: string }
        chain_id: { type: integer, minimum: 1 }
        network: { type: string }
        token: { type: string }
        recipient: { type: string }
        merchant_atomic: { type: string, pattern: '^[0-9]+$' }
        fee_atomic: { type: string, pattern: '^[0-9]+$' }
        gross_atomic: { type: string, pattern: '^[0-9]+$' }
        native_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        approval_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        payment_fee_atomic: { type: string, pattern: '^[0-9]+$' }
        native_currency: { type: string }
        native_decimals: { type: integer }
        total_usd_atomic: { type: string, pattern: '^[0-9]+$' }
        wallet_actions: { type: integer }
        gas_financed: { type: boolean }
        expires_at: { type: string, format: date-time }
        snapshot: { type: string }

    StablecoinDecisionProposal:
      type: object
      required: [wallet, choices, comparison_complete, findings, expires_at,
        amount_atomic, amount_decimals, asset]
      properties:
        wallet: { $ref: "#/components/schemas/StablecoinDecisionWallet" }
        choices:
          type: array
          items: { $ref: "#/components/schemas/StablecoinDecisionQuote" }
        recommended_id: { type: string }
        comparison_complete: { type: boolean }
        findings:
          type: array
          nullable: true
          items:
            type: object
            required: [payment_method, code]
            properties:
              payment_method: { type: string }
              chain_id: { type: integer }
              code:
                type: string
                description: |
                  Why a method or chain is not among the choices. Among them,
                  `forward_unchecked`: a route across networks from this chain
                  could not be checked (unknown, never "no route"); and
                  `forward_unavailable`: it was checked and is not offered.
                  Any finding makes `comparison_complete` false.
        expires_at: { type: string, format: date-time }
        amount_atomic: { type: string, pattern: '^[0-9]+$' }
        amount_decimals: { type: integer, enum: [6] }
        asset: { type: string, enum: [USDT, USDC] }

    StablecoinCheckoutLinkProposal:
      type: object
      description: |
        The checkout-link discovery answer. As `StablecoinDecisionProposal`,
        except that `asset` is absent when the link offers USDT and USDC:
        both count in the same six decimals at par.
      required: [wallet, choices, comparison_complete, findings, expires_at,
        amount_atomic, amount_decimals]
      properties:
        wallet: { $ref: "#/components/schemas/StablecoinDecisionWallet" }
        choices: { $ref: "#/components/schemas/StablecoinDecisionProposal/properties/choices" }
        recommended_id: { type: string }
        comparison_complete: { type: boolean }
        findings: { $ref: "#/components/schemas/StablecoinDecisionProposal/properties/findings" }
        expires_at: { type: string, format: date-time }
        amount_atomic: { type: string, pattern: '^[0-9]+$' }
        amount_decimals: { type: integer, enum: [6] }
        asset: { type: string, enum: [USDT, USDC] }

    Problem:
      type: object
      description: |
        RFC 7807 error envelope. Every failure response from this API
        carries this shape; match on `code` for stable integration
        behaviour. See the per-code merchant-facing remedy pages at
        `https://chainmore.io/errors/<slug>` (the full URL is
        also returned inline as `docs_url`).
      required: [title, code]
      properties:
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code (mirrors the response status).
        detail:
          type: string
          description: Longer human-readable detail; may include sanitized error text.
        code:
          type: string
          description: |
            Stable machine-readable error code. See the error reference
            at https://chainmore.io/errors for the remedy for each code.
            New codes may be added at any time; clients MUST NOT treat an
            unknown code as a parse error.
          enum:
            - attempt_binding_mismatch
            - checkout_link_already_bound
            - checkout_link_expired
            - checkout_link_method_unavailable
            - checkout_link_not_found
            - checkout_operation_failed
            - checkout_terms_changed
            - create_endpoint_failed
            - create_key_failed
            - create_payment_failed
            - cross_merchant_forbidden
            - dashboard_mode_changed
            - dashboard_mode_required
            - dashboard_operation_failed
            - dashboard_role_forbidden
            - delivery_endpoint_mismatch
            - disable_endpoint_failed
            - dispatch_failed
            - dispatch_lookup_failed
            - dispatch_precondition_failed
            - endpoint_disabled
            - endpoint_secret_missing_envelope
            - exec_dispatch_binding_mismatch
            - exec_dispatch_decision_not_found
            - exec_dispatch_not_allowed
            - exec_no_dispatch_decision
            - handouts_paused
            - idempotency_required
            - invalid_authorization_mode
            - invalid_json
            - invalid_request
            - invalid_state
            - invalid_transition
            - jwt_expired
            - jwt_invalid
            - list_endpoints_failed
            - list_keys_failed
            - membership_missing
            - merchant_limit_reached
            - method_not_allowed
            - not_found
            - not_implemented
            - payment_lookup_failed
            - payout_target_not_declared
            - payout_targets_dashboard_only
            - pending_confirmation
            - rail_not_ready
            - rate_limited
            - register_direct_tx_failed
            - replay_delivery_failed
            - replay_of_test_event_forbidden
            - revoke_key_failed
            - rotate_endpoint_secret_failed
            - rotate_key_failed
            - routing_lookup_failed
            - routing_plan_failed
            - routing_precondition_failed
            - server_misconfigured
            - session_expired
            - start_attempt_failed
            - start_attempt_precondition_failed
            - test_event_failed
            - unauthorized
            - update_endpoint_failed
            - usdt0_source_unobserved
            - usdt0_upstream_unavailable
            - validation_failed
            - validation_lookup_failed
            - validation_precondition_failed
            - wallet_account_unsupported
            - wallet_call_would_revert
            - wallet_chain_not_accepted
            - wallet_insufficient_native_gas
            - wallet_insufficient_usdc
            - wallet_insufficient_usdt
            - wallet_not_connected
            - wallet_unsupported
            - wallet_wrong_chain
            - wrong_auth_kind
        retryable:
          type: boolean
          description: |
            `true` when the client can safely retry the same request;
            `false` (the default) when the failure requires a shape
            change. Rate-limit and some server-side failures are
            retryable.
        docs_url:
          type: string
          format: uri
          description: |
            Merchant-facing docs URL for this specific refusal code.
            Stable per `code` value - safe to link to from dashboards
            or verifiers. Empty when the code is unregistered (which
            the refusalcodes drift-check guards against in CI).
          example: https://chainmore.io/errors/endpoint-disabled
        correlation_id:
          type: string
          description: Server-generated correlation ID; echoed in `X-Correlation-ID`.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    MerchantIntakeRequest:
      type: object
      description: |
        Public pre-account application request. Submitting this form does
        not create a merchant account, dashboard user, API key, provider
        configuration, live mode, or money movement capability.
      required:
        - first_name
        - last_name
        - role
        - work_email
        - company_name
        - country
        - registration_number
        - business_address
        - what_they_sell
        - customer_regions
        - volume_band
        - consent
      properties:
        first_name: { type: string, minLength: 1, maxLength: 80 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string, minLength: 1, maxLength: 120 }
        work_email: { type: string, format: email, minLength: 3, maxLength: 320 }
        phone: { type: string, maxLength: 80 }
        company_name: { type: string, minLength: 1, maxLength: 180 }
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO-3166 alpha-2 country code.
          example: DE
        registration_number: { type: string, minLength: 1, maxLength: 120 }
        vat_id: { type: string, maxLength: 80 }
        business_address: { type: string, minLength: 1, maxLength: 500 }
        website_url: { type: string, format: uri, maxLength: 500 }
        what_they_sell:
          type: string
          minLength: 20
          maxLength: 1000
          description: Short free-text description of products, services, and use case.
        customer_regions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [dach, eu, uk, usa, worldwide, other]
        volume_band:
          type: string
          enum: [lt_10k, 10k_50k, 50k_250k, gt_250k, unknown]
        current_psp: { type: string, maxLength: 160 }
        locale:
          type: string
          enum: [de, en]
          default: en
        consent:
          type: boolean
          description: Must be true to submit the request.
        website_url_honeypot:
          type: string
          description: Bot trap. Human clients must leave this hidden field empty.

    MerchantIntakeResponse:
      type: object
      required: [reference, submitted_at]
      properties:
        reference:
          type: string
          pattern: '^CM-[A-Z0-9]{6}$'
          description: Human support reference for the application.
          example: CM-ABC234
        submitted_at:
          type: string
          format: date-time

    # ── Payments (Execution) ────────────────────────────────────────────────
    SettlementDestination:
      type: object
      description: |
        One payout target: where the merchant receives one token on one
        chain (ADR-0075). `corridor` is `usdt0` (the legacy alias for USDT on
        Arbitrum) or `<token>:<chain>` with token `usdt`|`usdc` and chain
        `ethereum`|`arbitrum`|`polygon`|`optimism`|`bsc`|`base`|`tron`.
        `token` and `chain` repeat the parsed corridor.
      required: [corridor, mode, settlement_destination, status, priority, updated_at]
      properties:
        corridor:               { type: string, pattern: "^(usdt0|(usdt|usdc):[a-z0-9-]{1,32})$", example: "usdt:tron" }
        token:                  { type: string, enum: [usdt, usdc] }
        chain:                  { type: string, enum: [ethereum, arbitrum, polygon, optimism, bsc, base, tron] }
        mode:                   { type: string, enum: [test, live] }
        settlement_destination: { type: string, description: "The merchant's own account: lowercase CAIP-10 for EVM chains (e.g. eip155:1:0x…), or the TRON account tron:0x2b6653dc:T…" }
        status:                 { type: string, enum: [active, disabled] }
        priority:               { type: integer, minimum: 0, maximum: 1000, description: "Rank among the merchant's targets of the same token; lower wins. Default 100." }
        updated_at:             { type: string, format: date-time }

    PutSettlementDestinationRequest:
      type: object
      required: [settlement_destination]
      additionalProperties: false
      properties:
        settlement_destination:
          type: string
          description: |
            The merchant's own account on the corridor's chain. EVM chains:
            CAIP-10 on that chain (`eip155:1:0x…`) or a bare `0x` address; a
            mixed-case address must carry a valid EIP-55 checksum. TRON: the
            `T…` base58 address (or its CAIP-10 form).
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
          description: Rank among the merchant's targets of the same token; lower wins. A payment without an explicit `settlement_destination` delivers to the highest-priority USDT target.

    ListSettlementDestinationsResponse:
      type: object
      required: [settlement_destinations]
      properties:
        mode: { type: string, enum: [test, live], description: "The caller's resolved mode the list belongs to." }
        settlement_destinations:
          type: array
          items: { $ref: "#/components/schemas/SettlementDestination" }

    CreatePaymentRequest:
      type: object
      description: |
        Exactly the fields the Core accepts (`domain.CreatePaymentRequest`).
        The payment corridor is server-derived from `payment_method`; the
        caller never asserts a payment case, settlement rail, asset or
        checkout flag. `merchant_id` must match the bearer's merchant.
      required: [merchant_id, amount_minor, currency]
      additionalProperties: false
      properties:
        merchant_id:           { type: string }
        settlement_profile_id: { type: string, description: "Merchant provider profile the payment settles through (merchant_provider_profiles.id)." }
        merchant_order_id:     { type: string, description: "Merchant order reference; idempotency key of the payment per merchant." }
        amount_minor:          { type: integer, minimum: 1 }
        currency:              { type: string, description: "ISO-4217 fiat code of the requested amount, e.g. EUR." }
        payment_method:
          type: string
          enum: [card, usdt0, usdc]
          description: |
            Customer payment method that selects the corridor. `usdc`: the
            customer pays USDC on their own chain and the merchant receives
            USDC there, into the payout target declared for that chain
            (ADR-0077); amount in six-decimal base units, currency `USDC`;
            admitted only when the gateway has the USDC rail mounted. `card`: the
            customer card is charged in EUR and the merchant settles in EUR
            (`fiat_to_fiat`, payer rail fiat, settlement rail fiat, canonical
            asset EUR). `currency` must be exactly `EUR`; any other or
            non-canonical value is refused (400). No conversion, stablecoin
            or delivery leg is implied. Sandbox/test mode only; a live-mode
            card payment is refused. `usdt0`: the customer's own wallet sends
            USDT on Ethereum and the merchant receives USDT0 on Arbitrum at
            `settlement_destination` (`stable_to_stable`, stablecoin rails,
            canonical asset USDT, six-decimal base units); `currency` must be
            exactly `USDT`, `settlement_destination` is required, and the
            gateway must have the corridor mounted (otherwise 400). Admitted
            in test mode, and in live mode for a merchant whose live access
            is approved and enabled (otherwise 400). Omitted: no corridor is
            derived (the legacy non-card path).
        settlement_destination:
          type: string
          description: |
            The merchant's own account the rail delivers to: a CAIP-10
            account id on a chain the rails pay on (`eip155:<chain>:0x...`)
            or a TRON account (`tron:0x2b6653dc:T...`). A bare `0x` address
            names no network and is accepted only when it is the merchant's
            declared target on Arbitrum for the payment's token (or the
            legacy `usdt0`); otherwise 400 invalid_request. Created with an
            API key, any address must be an active payout target of the
            merchant for the payment's mode, token and chain; otherwise 400
            payout_target_not_declared. Payout targets are added by an owner
            or admin in the dashboard. Omitted: the merchant's
            highest-priority payout target, which must lie on its own
            corridor's chain. Refused for methods that do not deliver on
            chain. ChainMore never substitutes an address of its own: the
            customer's transfer lands directly in this account.
        metadata:
          type: object
          additionalProperties: true
          description: Opaque merchant metadata stored on the payment.

    CreatePaymentResponse:
      type: object
      required: [payment_id]
      properties:
        payment_id: { type: string }

    PaymentView:
      type: object
      description: Read-model view of a Payment aggregate.
      required: [id, merchant_id, public_status, orchestration_state]
      properties:
        id:                     { type: string }
        merchant_id:            { type: string }
        merchant_order_id:      { type: string }
        requested_amount_minor: { type: integer }
        requested_currency:     { type: string }
        canonical_asset:        { type: string }
        payment_case:           { type: string }
        public_status:          { type: string, description: "Merchant-visible status." }
        orchestration_state:    { type: string, description: "Internal orchestration state." }
        checkout_required:      { type: boolean }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }

    StartAttemptRequest:
      type: object
      properties:
        route_candidate_id:  { type: string }
        route_validation_id: { type: string }

    StartAttemptResponse:
      type: object
      required: [attempt_id]
      properties:
        attempt_id: { type: string }
        leg_ids:
          type: array
          items: { type: string }

    RegisterDirectTxRequest:
      type: object
      required: [leg_id, tx_hash]
      properties:
        leg_id:  { type: string }
        tx_hash: { type: string, description: "0x-prefixed hex." }

    RegisterDirectTxResponse:
      type: object
      required: [leg_id, tx_hash]
      properties:
        leg_id:  { type: string }
        tx_hash: { type: string }

    # ── Checkout (CKO) ──────────────────────────────────────────────────────
    InitSessionRequest:
      type: object
      required: [payment_id]
      properties:
        payment_id: { type: string }

    InitSessionResponse:
      type: object
      required: [session_id, checkout_token, expires_at]
      properties:
        session_id:
          type: string
          description: "CKO session ID (bound 1:1 to payment_id)."
        checkout_token:
          type: string
          description: |
            Raw checkout token. Present only in this response; the server
            persists `sha256(token)` (CKO-I4) and never the raw value.
        expires_at:
          type: string
          format: date-time

    BindWalletRequest:
      type: object
      required: [wallet_address, chain_id]
      properties:
        wallet_address: { type: string }
        chain_id:       { type: string, description: "CAIP-2 chain identifier, e.g. eip155:137." }

    BindWalletResponse:
      type: object
      required: [state]
      properties:
        state:                      { type: string, description: "New CKO state after binding." }
        route_candidate_id:         { type: string }
        route_validation_id:        { type: string }
        selected_route_fingerprint: { type: string }
        quote_expires_at:           { type: string, format: date-time }

    SubmitExecutionRequest:
      type: object
      required: [authorization_mode]
      properties:
        tx_hash:
          type: string
          description: |
            0x-prefixed hex. Required for `direct_wallet_tx`; ignored for
            sponsored flows where the relay reports back asynchronously.
        authorization_mode:
          type: string
          description: |
            One of: `direct_wallet_tx`, `permit_2612`, `transfer_with_authorization`,
            `gasless_userop`. Must be supported by the selected route.

    SubmitExecutionResponse:
      type: object
      required: [state]
      properties:
        state:                  { type: string, description: "New CKO state after submit." }
        dispatch_decision_id:   { type: string }
        payment_attempt_id:     { type: string }
        submitted_tx_hash:      { type: string }

    CheckoutState:
      type: object
      description: Read-model view the hosted-checkout frontend polls.
      required: [state]
      properties:
        state:                      { type: string }
        payment_id:                 { type: string }
        wallet_address:             { type: string }
        chain_id:                   { type: string }
        selected_route_fingerprint: { type: string }
        route_candidate_id:         { type: string }
        route_validation_id:        { type: string }
        dispatch_decision_id:       { type: string }
        payment_attempt_id:         { type: string }
        settlement_journal_id:      { type: string }
        submitted_tx_hash:          { type: string }
        failure_reason:             { type: string }
        quote_expires_at:           { type: string, format: date-time }
        expires_at:                 { type: string, format: date-time }
        terminal_at:                { type: string, format: date-time }
        updated_at:                 { type: string, format: date-time }

    CheckoutSession:
      type: object
      description: Full CKO session record returned by the by-token lookup.
      required: [id, payment_id, state]
      properties:
        id:                         { type: string }
        payment_id:                 { type: string }
        checkout_token_hash:        { type: string }
        state:                      { type: string }
        wallet_address:             { type: string }
        chain_id:                   { type: string }
        selected_route_fingerprint: { type: string }
        route_candidate_id:         { type: string }
        route_validation_id:        { type: string }
        dispatch_decision_id:       { type: string }
        payment_attempt_id:         { type: string }
        settlement_journal_id:      { type: string }
        submitted_tx_hash:          { type: string }
        failure_reason:             { type: string }
        quote_expires_at:           { type: string, format: date-time }
        expires_at:                 { type: string, format: date-time }
        terminal_at:                { type: string, format: date-time }
        created_at:                 { type: string, format: date-time }
        updated_at:                 { type: string, format: date-time }

    # ── Merchants (reserved; Phase-1) ───────────────────────────────────────
    MerchantsReservedResponse:
      type: object
      description: |
        Phase-1 reserved response. The merchants surface is frozen as an
        observable shape so clients can detect when it becomes available.
      properties:
        status:
          type: string
          enum: [reserved]

    # ── Routing (REC) ───────────────────────────────────────────────────────
    PlanRouteRequest:
      type: object
      required: [payment_id, checkout_session_id]
      properties:
        payment_id:          { type: string }
        checkout_session_id: { type: string }

    RoutingDecision:
      type: object
      description: |
        Authoritative engine output. Per REC-I1 C1 every engine-relevant
        field is reconstructed server-side from Payment + CheckoutSession;
        the caller only supplies the two binding IDs.
      required: [id, candidates]
      properties:
        id:                 { type: string }
        payment_id:         { type: string }
        checkout_session_id:{ type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/RouteCandidate" }
        created_at:         { type: string, format: date-time }

    RouteCandidate:
      type: object
      required: [id, fingerprint]
      properties:
        id:             { type: string }
        fingerprint:    { type: string }
        provider_id:    { type: string }
        source_chain:   { type: string }
        destination_chain: { type: string }
        source_asset:   { type: string }
        destination_asset:{ type: string }
        score:          { type: number }
        supports_permit: { type: boolean }
        supports_auth_tx: { type: boolean }
        gasless_supported:{ type: boolean }
        quote_ttl_ms:    { type: integer }

    # ── Validation (PFV) ────────────────────────────────────────────────────
    ValidateRouteRequest:
      type: object
      required: [payment_id, checkout_session_id, route_candidate_id]
      properties:
        payment_id:          { type: string }
        checkout_session_id: { type: string }
        route_candidate_id:  { type: string }

    RouteValidation:
      type: object
      required: [id, passed]
      properties:
        id:                { type: string }
        route_candidate_id:{ type: string }
        passed:            { type: boolean }
        would_deny_if_enforced:
          type: boolean
          description: |
            Rollout projection. True means the route may still pass in
            the current visible/advisory stage, but at least one failed
            or unknown check would deny the route once PFV enforcement is
            enabled.
        would_deny_codes:
          type: array
          items: { type: string }
          description: Structured check codes behind the would-deny projection.
        checks:
          type: array
          items: { $ref: "#/components/schemas/ValidationCheck" }
        expires_at:        { type: string, format: date-time }
        created_at:        { type: string, format: date-time }

    ValidationCheck:
      type: object
      required: [type, passed, status]
      properties:
        type:   { type: string }
        passed: { type: boolean }
        status:
          type: string
          enum: [passed, failed, unknown]
        code:   { type: string }
        detail: { type: string }

    # ── Dispatch (DISP) ─────────────────────────────────────────────────────
    DispatchDecideRequest:
      type: object
      required: [payment_id, checkout_session_id, route_candidate_id]
      properties:
        payment_id:          { type: string }
        checkout_session_id: { type: string }
        route_candidate_id:  { type: string }
        route_validation_id: { type: string }

    DispatchDecision:
      type: object
      required: [id, admitted]
      properties:
        id:                  { type: string }
        payment_id:          { type: string }
        checkout_session_id: { type: string }
        route_candidate_id:  { type: string }
        route_validation_id: { type: string }
        admitted:            { type: boolean }
        rejection_code:      { type: string }
        rejection_detail:    { type: string }
        engine_version:      { type: string }
        created_at:          { type: string, format: date-time }

    # ── Widget / Hosted Checkout (WGT-I1) ────────────────────────────────────
    WidgetCardSubmitRequest:
      type: object
      additionalProperties: false
      required: [payment_handle_token]
      properties:
        payment_handle_token:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Single-use Paysafe payment handle token collected client-side.
            It is consumed in memory only; the server never persists, logs or
            echoes it. No other property is accepted.

    WidgetCardSubmitResponse:
      type: object
      required: [state, replayed, accepted]
      properties:
        state:
          type: string
          enum: [completed, failed, processing, unknown, in_flight]
          description: |
            Redacted product state of the sandbox card charge. `completed`
            and `failed` are final; `processing` awaits provider truth;
            `unknown` and `in_flight` mean an effect may exist at the
            provider and the browser must not retry.
        replayed:
          type: boolean
          description: "True when durable truth was returned without a new provider call."
        accepted:
          type: boolean
          description: "True when the provider accepted the charge (completed or processing)."

    CheckoutLinkCreateRequest:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1, description: "Minor units of currency (USD/EUR cents)." }
        currency: { type: string, enum: [USD, EUR], description: "USD offers the stablecoin rails at par; EUR offers card." }
        merchant_order_id: { type: string, maxLength: 128 }
        settlement_profile_id: { type: string, description: "Merchant provider profile (merchant_provider_profiles.id) the card/USDT payment settles through; omitted resolves the merchant's default or only active profile." }
        metadata: { type: object, additionalProperties: true }
        settlement_destination: { type: string, description: "The merchant's own USDT account on a chain the rails pay on: eip155 CAIP-10 (eip155:1:0x…, eip155:42161:0x…) or a TRON account (tron:0x2b6653dc:T…); a bare 0x address names no network and is accepted only when it is the merchant's declared USDT target on Arbitrum (otherwise 400 invalid_request); omitted: the merchant's highest-priority USDT payout target (ADR-0075). A mixed-case 0x address must carry a valid EIP-55 checksum unless it spells an account the merchant has declared (an active USDT payout target or the usdt0 default): that account is admitted in any spelling and stored lowercase. Any other spelling with a broken checksum is refused with the reason (400 invalid_request)." }
        usdc:
          type: object
          description: Optional explicit USDC routing details. When omitted, same-chain USDC can be offered if the merchant has an active settlement profile, a USDC payout destination and the USDC route is enabled.
          required: [merchant_wallet, source_chain, dest_chain]
          properties:
            merchant_wallet: { type: string }
            source_chain: { type: string }
            dest_chain: { type: string }
            fee_bps: { type: integer, minimum: 0, maximum: 100 }
        return_url: { type: string, maxLength: 2048 }
    CheckoutLink:
      type: object
      required: [checkout_link_id, state, amount_minor, currency, available_payment_methods, created_at, expires_at]
      properties:
        checkout_link_id: { type: string }
        checkout_token: { type: string, description: "cl_ bearer for the customer URL; returned once on create." }
        state: { type: string, enum: [open, bound] }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        merchant_order_id: { type: string }
        available_payment_methods: { type: array, items: { type: string, enum: [card, usdt0, usdc] } }
        payment_method: { type: string, enum: [card, usdt0, usdc] }
        payment_id: { type: string, description: "Payment identifier once the link is bound." }
        bound_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CheckoutLinkView:
      type: object
      required: [token_kind, state, display, available_payment_methods, expires_at, generated_at]
      properties:
        token_kind: { type: string, enum: [checkout_link] }
        state: { type: string, enum: [open, bound, expired] }
        display:
          type: object
          properties:
            amount_minor: { type: integer, format: int64 }
            currency: { type: string }
            amount_display: { type: string }
            merchant_display: { type: string }
            merchant_order_id: { type: string }
        available_payment_methods: { type: array, items: { type: string, enum: [card, usdt0, usdc] } }
        payment_method: { type: string }
        checkout_token: { type: string, description: "Concrete checkout token once bound; the page continues there." }
        expires_at: { type: string, format: date-time }
        generated_at: { type: string, format: date-time }
    CheckoutLinkSelection:
      type: object
      required: [payment_method, checkout_token]
      properties:
        payment_method: { type: string, enum: [card, usdt0, usdc] }
        checkout_token: { type: string }
        payment_id: { type: string }
    WidgetSessionView:
      type: object
      description: |
        Redacted, server-computed view the Hosted Checkout / Widget
        renders from. WGT-I1: every pixel is a pure function of this
        body. The raw checkout token is NEVER echoed in this view.
      required: [session_id, payment_id, state, next_action, display, expires_at]
      properties:
        session_id:        { type: string }
        payment_id:        { type: string }
        state:             { type: string, description: "Raw CKO state; UI MUST drive from next_action, not state." }
        next_action:
          type: string
          description: |
            Server-issued UI directive. One of: `connect_wallet`,
            `select_route`, `awaiting_user_signature`, `processing`,
            `settled`, `failed`, `expired`, `cancelled`.
        surface_status:
          type: string
          enum: [awaiting, processing, delayed, needs_review, completed, failed_safely, expired]
          description: Rail-neutral customer status vocabulary derived from `state`; the hosted shell renders every rail from it.
        available_payment_methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [card, usdt0, usdc]
          description: |
            Customer payment methods the server admits for this session. `card` is present only for an admitted fiat card payment (payment_method=card: fiat_to_fiat in one currency); wallet sessions omit the field.
        card_charge:
          $ref: "#/components/schemas/WidgetCardCharge"
        usdt0:
          $ref: "#/components/schemas/CheckoutUSDT0View"
        display:
          type: object
          required: [amount_minor, currency]
          properties:
            amount_minor:     { type: integer }
            currency:         { type: string }
            asset:            { type: string }
            merchant_display: { type: string }
            merchant_order_id:{ type: string }
            amount_display:
              type: string
              description: Requested amount formatted in major units of `currency` by the server (e.g. "100.00"); the browser never formats money itself.
        wallet:
          type: object
          properties:
            address:  { type: string }
            chain_id: { type: string }
        routes:
          type: array
          items:
            type: object
            required: [fingerprint, authorization_mode]
            properties:
              fingerprint:         { type: string }
              authorization_mode:  { type: string }
              estimated_fee_minor: { type: integer }
              is_primary:          { type: boolean }
        submitted:
          type: object
          properties:
            tx_hash: { type: string }
        failure:
          type: object
          properties:
            code:        { type: string }
            description: { type: string }
        settlement:
          type: object
          properties:
            settled_at: { type: string, format: date-time }
        expires_at:       { type: string, format: date-time }
        quote_expires_at: { type: string, format: date-time }

    WidgetCardCharge:
      type: object
      description: |
        Public, non-secret card method block of a Core checkout session,
        present only when the server admits `card`. `amount_minor`/`currency`
        are the exact fiat facts the card is charged (the Core payment's
        requested amount and currency; the merchant settles in the same
        currency), `reference` is the server-derived provider reference the
        charge carries once the canonical attempt/leg has been admitted
        through `POST /v1/checkout/widget/card/prepare` (empty before; the
        browser passes it to the provider payment handle so handle and
        charge agree), and `state` is the durable card execution state used
        for re-render/reload recovery. An empty state only means that no
        provider effect is visible at this read; it is not a proof that
        nothing was submitted. `in_flight`, `processing` and `unknown` mean
        the browser must not submit again and should read again;
        `completed`/`failed` are final. No provider identifier, credential
        or token appears here.
      required: [amount_minor, currency, reference, state]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reference: { type: string, maxLength: 64 }
        state:
          type: string
          enum: ["", in_flight, processing, completed, failed, unknown]

    WidgetUSDT0PrepareRequest:
      type: object
      required: [payer_wallet]
      properties:
        payer_wallet:
          type: string
          pattern: '^(0x[0-9a-fA-F]{40}|T[1-9A-HJ-NP-Za-km-z]{33})$'
          description: The customer's wallet that will sign the source transactions, as its 0x address or, for a TRON wallet, its T… base58 form (the same 20-byte account).
        wallet_chain_id:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional. The chain the customer's wallet is connected to: an
            EIP-155 chain id, or 728126428 for a TRON wallet. It decides which
            of the merchant's declared payout targets the wallet can be paid
            into (ADR-0076): the same-chain rail tries the payment's stored
            chain first, then this chain, then the others of the wallet's
            address family, and delivers on each to the target the merchant
            declared there, or on the stored chain to the account the payment
            was bound to; a chain without an approval is not paid.
            It never changes the amount. The EIP-155 chain the customer's wallet is already
            connected to. The merchant's settlement chain is always tried
            first; among the other configured chains, a chain named here is
            tried before the rest, so a wallet funded off the settlement
            chain is spared a network switch. Paying on a chain other than
            the settlement chain delivers only to a payout target the
            merchant declared for that chain, exactly as without this field. Absent,
            unconfigured, unfunded or non-EVM values are ignored, and the
            field never changes the amount, the recipient or the fee.
        capabilities:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [forward_bounded_approval_v1]
          description: >-
            Optional. The wallet step contracts this client understands. With
            `forward_bounded_approval_v1` the forward rail may answer a payment
            without an attempt with `step` `approve_bounded`: one approval up to
            `approval_bound_ld`, before any quote, authorization or attempt; the
            payment is planned when prepare is asked again after the approval is
            covered. Without it the exact contract stays. An unknown value is
            refused.

    WidgetUSDT0TronTxRequest:
      type: object
      additionalProperties: false
      required: [leg_id]
      properties:
        leg_id:
          type: string
          format: uuid
          description: The reserved TRON leg whose retained call the node builds.
    WidgetUSDT0TronTxResponse:
      type: object
      additionalProperties: false
      required: [payment_id, leg_id, transaction, expires_at_ms]
      properties:
        payment_id: { type: string, format: uuid }
        leg_id: { type: string, format: uuid }
        expires_at_ms:
          type: integer
          format: int64
          description: raw_data.expiration in Unix milliseconds; the wallet must sign before it.
        transaction:
          type: object
          description: The node-built unsigned TriggerSmartContract (txID, raw_data, raw_data_hex, visible), passed to the wallet unchanged.
          additionalProperties: true
    WidgetUSDT0TronBroadcastRequest:
      type: object
      additionalProperties: false
      required: [leg_id, transaction]
      properties:
        leg_id:
          type: string
          format: uuid
        transaction:
          type: object
          description: The wallet-signed envelope (the built transaction plus signature[]).
          additionalProperties: true
    WidgetUSDT0SourceTxRequest:
      type: object
      required: [leg_id, tx_hash]
      properties:
        leg_id: { type: string, format: uuid }
        tx_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'

    CheckoutUSDT0Call:
      type: object
      description: |
        The exact unsigned transaction the wallet must sign for the current
        step. Gas hints are the simulated EIP-1559 envelope; the execution
        gas ceiling is enforced when the signed transaction is verified.
      required: [chain_id, from, to, value_wei, data]
      properties:
        chain_id: { type: integer, format: int64 }
        from: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        to: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        value_wei: { type: string, pattern: '^[0-9]+$' }
        data: { type: string, pattern: '^0x[0-9a-f]*$' }
        gas_limit: { type: integer, format: int64 }
        max_fee_per_gas_wei: { type: string, pattern: '^[0-9]+$' }
        max_priority_fee_per_gas_wei: { type: string, pattern: '^[0-9]+$' }

    CheckoutUSDT0Route:
      type: object
      required: [source_chain_id, destination_chain_id, source_token, source_oft, destination_token]
      properties:
        source_chain_id: { type: integer, format: int64 }
        destination_chain_id: { type: integer, format: int64 }
        source_token: { type: string }
        source_oft: { type: string }
        destination_token: { type: string }
        recipient:
          type: string
          description: The merchant's own Arbitrum account the OFT send delivers to, from the Core payment's settlement_destination; never a ChainMore address.
        delivery_estimate_seconds:
          type: integer
          minimum: 1
          description: For a USDC route across networks, the non-binding delivery estimate the customer accepted (about this long, it can take longer); never a maximum. Absent otherwise.

    CheckoutUSDT0Fee:
      type: object
      description: |
        Present when ChainMore's source fee adapter is pinned (ADR-0066):
        the merchant amount (what the merchant receives, the Core payment
        amount), ChainMore's fee and the gross the wallet pays, all in USDT
        base units (6 decimals). The fee is taken inside the payer's own
        transaction; absent when the corridor sends directly with no fee on
        chain.
      required: [merchant_amount_ld, fee_ld, gross_ld]
      properties:
        merchant_amount_ld: { type: string, pattern: '^[0-9]+$' }
        fee_ld: { type: string, pattern: '^[0-9]+$' }
        gross_ld: { type: string, pattern: '^[0-9]+$' }

    CheckoutUSDT0View:
      type: object
      description: |
        Redacted progress of a payment_method=usdt0 checkout, derived from
        Core rows and retained evidence on every read. `phase` says whether
        the wallet must sign (`await_wallet`, with `call`), what the corridor
        waits for (`await_source_receipt`, `await_source_finality`,
        `await_delivery`), or the terminal outcome (`completed`, `failed`,
        `expired`); `none` means no attempt exists yet.
      required: [phase, step_index, route]
      properties:
        phase:
          type: string
          enum: [none, await_wallet, await_source_receipt, await_source_finality, await_delivery, completed, failed, expired]
        step:
          type: string
          enum: [reset_approval, approve_exact, approve_bounded, send]
          description: >-
            The wallet step. `approve_bounded` only reaches a client that sent
            the capability `forward_bounded_approval_v1` to prepare: the forward
            rail's approval before any attempt exists, without `leg_id`, up to
            `approval_bound_ld`. The client sends it, waits for its receipt and
            asks prepare again until the payment's own call comes; it never
            reports its hash to source-tx.
        step_index: { type: integer }
        attempt_id: { type: string, format: uuid }
        leg_id: { type: string, format: uuid }
        call: { $ref: "#/components/schemas/CheckoutUSDT0Call" }
        valid_before_unix: { type: integer, format: int64 }
        approval_bound_ld:
          type: string
          pattern: '^[0-9]+$'
          description: >-
            With `approve_bounded`: the most the approval allows the adapter to
            pull, in token base units. It is the merchant amount, ChainMore's fee
            and the Circle fee maximum the customer accepted, not the debit: the
            payment pulls only its actual total, and any rest of the approval
            stays unused.
        quote_expires_at_block:
          type: integer
          format: int64
          description: >-
            With a forward burn call: the source block at which the provider
            quote inside the call expires. A call at or past it is never handed
            out; a client fetches the call again right before the wallet.
        source_head_block:
          type: integer
          format: int64
          description: The source chain head the hand-out observed.
        source_transaction: { type: string }
        source_guid: { type: string }
        destination_transaction: { type: string }
        detail:
          type: string
          description: |
            Free-text reason for the current phase. While the bound source
            transaction awaits inclusion it names the observation
            (`awaiting inclusion`, `pending on the source chain`, `not visible
            to the observer yet`). For `failed` it is the attempt failure
            code: `usdt0_source_reverted` (nothing moved, a new attempt may be
            prepared), `usdt0_source_abandoned` (the wallet cancelled or
            replaced the transaction without sending; a new attempt may be
            prepared), `usdt0_source_replaced` (the wallet executed the send
            under another hash; funds moved and the payment is reconciled by
            an operator, no new attempt is admitted), `usdt0_source_stale`
            (send pending beyond the stale horizon; no new attempt is
            admitted) or `usdt0_approval_stale` (an allowance transaction
            pending beyond the stale horizon; nothing moved, a new attempt
            may be prepared).
        route: { $ref: "#/components/schemas/CheckoutUSDT0Route" }
        fee: { $ref: "#/components/schemas/CheckoutUSDT0Fee" }
        delay: { $ref: "#/components/schemas/CheckoutUSDT0Delay" }
        delivery_stage:
          type: string
          enum: [attestation_pending, destination_pending, held]
          description: |
            Only for a forward payment in `await_delivery`: which of
            ChainMore's own records is still missing. `attestation_pending`:
            the burn is recorded, Circle's attestation is not yet.
            `destination_pending`: the attestation is recorded, the final mint
            on the destination is not yet. `held`: the delivery is held or
            delayed and under review; do not pay again. It names the missing
            record, never its cause or a time.

    CheckoutUSDT0Delay:
      type: object
      description: |
        Present in `await_delivery` when the delivery to the merchant
        failed and is held for clarification: the destination chain and
        the message provider's status both say so. The payment is not
        ended and nothing is sent again; it completes if the delivery
        still arrives. `merchant_notice` says how far the merchant was
        told: `delivered` (the merchant's endpoint acknowledged the
        `payment.delivery_delayed` event), `queued` (the event is not
        delivered yet) or `none` (no event reached or is on its way to the
        merchant).
      required: [merchant_notice]
      properties:
        merchant_notice:
          type: string
          enum: [delivered, queued, none]

    WidgetUSDT0Response:
      type: object
      required: [payment_id, usdt0]
      properties:
        payment_id: { type: string, format: uuid }
        usdt0: { $ref: "#/components/schemas/CheckoutUSDT0View" }

    WidgetCardPrepareResponse:
      type: object
      description: |
        Result of admitting the card method for the session: the exact fiat
        facts and the provider reference the browser must hand to the
        provider payment handle. `replayed` is true when the session was
        already card-owned; `state` is the durable card execution state.
      required: [amount_minor, currency, reference, state, replayed]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reference: { type: string, maxLength: 64 }
        state:
          type: string
          enum: ["", in_flight, processing, completed, failed, unknown]
        replayed: { type: boolean }

    # ── Merchant Dashboard read plane (MDA-I2 - read-only) ───────────────────
    MerchantIntegrationView:
      type: object
      description: |
        Summary of the merchant's integration posture, scoped to the
        bearer-resolved mode. Mirrors `domain.MerchantDashboardIntegrationView`
        in `internal/domain/dashboard.go`. All fields are redacted
        projections - no secrets, no api-key plaintext, no webhook
        signing material.

        The `mode` field reflects which mode the response was scoped
        to (the merchant's currently-resolved bearer mode); `active_api_key_count`
        and the webhook counters are filtered to that mode.
      required:
        - merchant_id
        - legal_name
        - status
        - default_currency
        - mode
        - dashboard_role
        - account_approval_status
        - live_mode_enabled
        - active_api_key_count
        - webhook_endpoint_count
        - webhook_endpoint_enabled_count
        - created_at
        - generated_at
      properties:
        merchant_id:                    { type: string }
        legal_name:                     { type: string }
        display_name:
          type: string
          maxLength: 80
          description: Optional merchant-maintained presentation label. Checkout and dashboard shells prefer it when present and fall back to legal_name when blank.
        status:                         { type: string, description: "merchant account status (e.g. 'active')." }
        default_currency:               { type: string, description: "ISO 4217 fiat code." }
        mode:                           { type: string, enum: [test, live], description: "Bearer-resolved mode this response was scoped to." }
        dashboard_role:                 { type: string, enum: [owner, admin, developer, finance, support, viewer], description: "Server-resolved merchant_members role for this dashboard session. Machine/API-key contexts are projected as viewer." }
        account_approval_status:        { type: string, enum: [sandbox, needs_info, live_approved, rejected, not_configured], description: "Server-side account live-access state; not a provider or rail readiness claim." }
        live_mode_enabled:              { type: boolean, description: "True only after the server-side live access gate is approved." }
        live_enabled_at:                { type: string, format: date-time, nullable: true, description: "Timestamp when live access was approved, if any." }
        active_api_key_count:           { type: integer, minimum: 0 }
        webhook_endpoint_count:         { type: integer, minimum: 0 }
        webhook_endpoint_enabled_count: { type: integer, minimum: 0 }
        created_at:                     { type: string, format: date-time, description: "Merchant joined-on timestamp." }
        generated_at:                   { type: string, format: date-time, description: "Server snapshot timestamp." }

    MerchantOnboardingProgressView:
      type: object
      description: |
        Read-only merchant setup progress contract. The response is
        computed from existing account profile, API-key, webhook,
        test-event, and settled test-payment evidence. It never
        returns key material, webhook signing material, raw provider
        payloads, or production credentials, and it never toggles live
        access.
      required:
        - merchant_id
        - mode
        - account_approval_status
        - live_mode_enabled
        - steps
        - generated_at
      properties:
        merchant_id:             { type: string }
        mode:                    { type: string, enum: [test, live], description: "Bearer-resolved dashboard mode." }
        account_approval_status: { type: string, enum: [sandbox, needs_info, live_approved, rejected, not_configured] }
        live_mode_enabled:       { type: boolean, description: "True only after server-side live access approval." }
        steps:
          type: array
          items: { $ref: "#/components/schemas/MerchantOnboardingStepView" }
        generated_at:            { type: string, format: date-time }

    DashboardModeSelectionRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [test, live]
          description: Requested dashboard mode. The server persists and revalidates this selection; arbitrary query/header/body mode hints on other endpoints are ignored.

    DashboardModeSelectionResponse:
      type: object
      required: [mode, allowed_modes, live_mode_enabled]
      properties:
        mode:
          type: string
          enum: [test, live]
          description: Effective server-resolved dashboard mode for subsequent OIDC dashboard requests.
        selected_mode:
          type: string
          enum: [test, live]
          description: Persisted server-side selection when the user explicitly chose a mode.
        allowed_modes:
          type: array
          items: { type: string, enum: [test, live] }
          description: Modes currently allowed by membership and merchant live-access policy.
        live_mode_enabled:
          type: boolean
          description: True only after server-side live access approval.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the persisted mode selection, if one exists.

    MerchantOnboardingStepView:
      type: object
      required: [step_id, status, required]
      properties:
        step_id:
          type: string
          enum:
            - account_profile
            - test_api_key
            - webhook_endpoint
            - webhook_test_event
            - first_payment_evidence
            - live_access
            - live_api_key
        status:
          type: string
          enum: [complete, missing, blocked, needs_review]
        required: { type: boolean }
        completed_at: { type: string, format: date-time, nullable: true }
        blocking_reason:
          type: string
          description: Bounded merchant-facing reason when status is blocked or needs_review.

    SubmitAccountProfileRequest:
      type: object
      description: |
        Merchant-user-submitted business profile that starts ChainMore
        account/DD review. The merchant_id is not accepted in this body;
        it is resolved from the authenticated dashboard user.
      required:
        - website_url
        - contact_email
        - country
        - business_type
        - use_case
      properties:
        website_url:
          type: string
          format: uri
          description: Public merchant website URL.
        contact_email:
          type: string
          format: email
          description: Operational contact for account review.
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO-3166 alpha-2 country code.
        business_type:
          type: string
          enum: [registered_business, sole_trader, platform, nonprofit, other]
        expected_monthly_volume_usd_bucket:
          type: string
          enum: [lt_10k, 10k_50k, 50k_250k, 250k_1m, gt_1m, unknown]
          default: unknown
          description: |
            Older form: a dollar band. Do not send it together with
            expected_monthly_volume_band or expected_monthly_volume_currency.
        expected_monthly_volume_band:
          type: string
          enum: [lt_10k, 10k_50k, 50k_250k, 250k_1m, gt_1m, gt_250k, unknown]
          description: |
            Expected monthly volume band in expected_monthly_volume_currency,
            which is required with it. USD admits lt_10k, 10k_50k, 50k_250k,
            250k_1m, gt_1m and unknown; EUR admits lt_10k, 10k_50k, 50k_250k,
            gt_250k and unknown (the bands of the public registration). A
            band is never converted between currencies.
        expected_monthly_volume_currency:
          type: string
          enum: [USD, EUR]
        use_case:
          type: string
          minLength: 20
          maxLength: 1000
          description: Bounded free-text description of the intended payment use case.

    SubmitAccountProfileResponse:
      type: object
      required: [submission_id, merchant_id, submitted_at]
      properties:
        submission_id: { type: string }
        merchant_id:   { type: string, description: "Authenticated merchant id resolved by the server." }
        submitted_at:  { type: string, format: date-time }

    UpdateMerchantDisplayNameRequest:
      type: object
      additionalProperties: false
      description: |
        Merchant-owned presentation-label update. The merchant_id is not
        accepted in this body; it is resolved from the authenticated dashboard
        user. Blank clears the optional label. The server trims and caps the
        value to 80 Unicode code points before storing it.
      required:
        - display_name
      properties:
        display_name:
          type: string
          maxLength: 80
          description: Optional checkout/dashboard presentation label. Legal identity remains legal_name.

    UpdateMerchantDisplayNameResponse:
      type: object
      required: [merchant_id, updated_at]
      properties:
        merchant_id:   { type: string, description: "Authenticated merchant id resolved by the server." }
        display_name:  { type: string, maxLength: 80, description: "Stored optional presentation label; omitted when cleared." }
        updated_at:    { type: string, format: date-time }

    MerchantAcceptanceDocument:
      type: object
      required: [id, title, url, source_sha256, sha256, content]
      properties:
        id:            { type: string, enum: [test-environment, terms, confidentiality] }
        title:         { type: string, maxLength: 160 }
        url:           { type: string, format: uri, description: "Published https source of the document." }
        source_sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: "SHA-256 of the published source." }
        sha256:        { type: string, pattern: "^[a-f0-9]{64}$", description: "SHA-256 of content." }
        content:       { type: string, maxLength: 65536, description: "Exact text shown to the user." }

    MerchantAcceptanceManifest:
      type: object
      required: [version, manifest_hash, documents]
      properties:
        version:       { type: string, maxLength: 64 }
        manifest_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        documents:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/MerchantAcceptanceDocument" }

    MerchantAcceptanceStatus:
      type: object
      required: [required, ready, role, can_accept_company, company_accepted, personal_accepted]
      properties:
        required:             { type: boolean, description: "The merchant was created at or after the cutoff." }
        ready:                { type: boolean, description: "Dashboard requests are admitted." }
        role:                 { type: string }
        can_accept_company:   { type: boolean, description: "Owner or admin; may accept the company terms." }
        company_accepted:     { type: boolean }
        personal_accepted:    { type: boolean }
        company_accepted_at:  { type: string, format: date-time }
        personal_accepted_at: { type: string, format: date-time }
        manifest:             { $ref: "#/components/schemas/MerchantAcceptanceManifest" }

    MerchantAcceptanceRequest:
      type: object
      additionalProperties: false
      description: |
        Explicit confirmations for the presented manifest. Merchant and user
        identity are never read from the body. company_terms and
        authorised_company_representative are set together or not at all.
      required:
        - version
        - manifest_hash
        - test_environment
        - terms_acknowledgement
        - confidentiality
        - company_terms
        - authorised_company_representative
      properties:
        version:                           { type: string, maxLength: 64 }
        manifest_hash:                     { type: string, pattern: "^[a-f0-9]{64}$" }
        test_environment:                  { type: boolean, enum: [true] }
        terms_acknowledgement:             { type: boolean, enum: [true] }
        confidentiality:                   { type: boolean, enum: [true] }
        company_terms:                     { type: boolean }
        authorised_company_representative: { type: boolean }

    AccountProfileReadbackResponse:
      type: object
      description: |
        Current merchant business-profile submission for dashboard readback.
        It is the merchant-facing version of the DD/KYB intake state and
        deliberately excludes internal review notes, operator identities,
        document storage, and live-approval actions.
      required:
        - submitted
        - merchant_id
        - approval_status
        - live_mode_enabled
        - profile_updated_at
        - destructive_actions
      properties:
        submitted:          { type: boolean }
        submission_id:      { type: string }
        merchant_id:        { type: string, description: "Authenticated merchant id resolved by the server." }
        approval_status:    { type: string, enum: [sandbox, needs_info, live_approved, rejected, not_configured] }
        live_mode_enabled:  { type: boolean }
        website_url:        { type: string, format: uri }
        contact_email:      { type: string, format: email }
        country:            { type: string, minLength: 2, maxLength: 2 }
        business_type:      { type: string, enum: [registered_business, sole_trader, platform, nonprofit, other] }
        expected_monthly_volume_usd_bucket:
          type: string
          enum: [lt_10k, 10k_50k, 50k_250k, 250k_1m, gt_1m, unknown]
          description: Present only when the band is a dollar band.
        expected_monthly_volume_band:
          type: string
          enum: [lt_10k, 10k_50k, 50k_250k, 250k_1m, gt_1m, gt_250k, unknown]
          description: The band in expected_monthly_volume_currency.
        expected_monthly_volume_currency:
          type: string
          enum: [USD, EUR]
        use_case:           { type: string, minLength: 20, maxLength: 1000 }
        prefilled_from_registration:
          type: array
          items:
            type: string
            enum: [country, use_case, expected_monthly_volume]
          description: |
            Before any profile submission in either mode, the fields taken
            from the registration this merchant was created from. Reading
            stores and submits nothing.
        submitted_at:       { type: string, format: date-time }
        profile_updated_at: { type: string, format: date-time }
        destructive_actions:
          type: string
          enum: [not_available_on_read_endpoint]

    DashboardPaymentView:
      type: object
      description: |
        Mirrors `domain.MerchantDashboardPaymentView` - the redacted
        merchant-facing projection of a Payment row. Pipeline-internal
        fields (rail, route candidate, dispatcher decision, operator
        wallet) are deliberately absent.
      required:
        - payment_id
        - merchant_order_id
        - environment
        - requested_amount_minor
        - requested_currency
        - public_status
        - checkout_required
        - created_at
        - updated_at
      properties:
        payment_id:             { type: string }
        merchant_order_id:      { type: string }
        environment:            { type: string, enum: [sandbox, production] }
        requested_amount_minor: { type: integer, format: int64 }
        requested_currency:     { type: string, description: "ISO 4217 fiat code." }
        canonical_asset:        { type: string, description: "Settlement asset symbol; omitted before resolution." }
        public_status:          { type: string, description: "Merchant-facing payment status (same enum the webhook payload carries)." }
        checkout_required:      { type: boolean }
        mode:                   { type: string, enum: [test, live], description: "Per-row mode mirror; redundant with the page-level scope but kept for single-row debug copies." }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }

    DashboardRequestedAmountTotal:
      type: object
      required: [currency, amount_minor, payment_count]
      properties:
        currency:      { type: string, description: "Requested fiat currency. This is not the settlement asset." }
        amount_minor:  { type: integer, format: int64, description: "Sum of requested fiat minor units for the filtered set." }
        payment_count: { type: integer, minimum: 0 }

    DashboardPaymentStatusCount:
      type: object
      required: [public_status, payment_count]
      properties:
        public_status: { type: string, description: "Merchant-facing payment status." }
        payment_count: { type: integer, minimum: 0 }

    DashboardExceptionStatusCount:
      type: object
      required: [surface_status, payment_count]
      properties:
        surface_status:
          type: string
          enum: [delayed, needs_review, failed_safely, expired]
          description: |
            Merchant-facing exception status of the Core payments:
            settlement_exception counts as needs_review, failed as
            failed_safely, expired as expired. delayed has no Core source
            and stays absent.
        payment_count: { type: integer, minimum: 0 }
        oldest_entered_at:
          type: string
          format: date-time
          description: Oldest state-entered timestamp for this exception group, when present. Core payments carry no such timestamp, so it is absent.

    DashboardExceptionSummary:
      type: object
      required: [items, total_count, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardExceptionStatusCount" }
        total_count:
          type: integer
          minimum: 0
          description: Sum of all exception rows for the authenticated merchant and mode.
        generated_at: { type: string, format: date-time }

    DashboardPaymentsSummary:
      type: object
      required: [total_count, requested_amount_totals, status_counts, export_row_limit, filtered]
      properties:
        total_count: { type: integer, minimum: 0, description: "Full filtered result count, not just the current cursor page." }
        requested_amount_totals:
          type: array
          description: Requested fiat totals grouped by requested_currency. Settlement assets remain separate; no USD↔USDC conversion is implied.
          items: { $ref: "#/components/schemas/DashboardRequestedAmountTotal" }
        status_counts:
          type: array
          items: { $ref: "#/components/schemas/DashboardPaymentStatusCount" }
        export_row_limit:
          type: integer
          minimum: 1
          description: Current synchronous CSV export row cap used by the Gateway.
        filtered: { type: boolean, description: "True when q/status/date filters narrowed the result set." }

    DashboardPaymentsPage:
      type: object
      description: |
        Mirrors `domain.MerchantDashboardPaymentsPage`. Cursor-based
        pagination via `next_cursor` + `has_more`. `summary` describes
        the full filtered set, not only the current page.
      required: [items, has_more, summary, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardPaymentView" }
        has_more:     { type: boolean }
        next_cursor:  { type: string }
        summary:      { $ref: "#/components/schemas/DashboardPaymentsSummary" }
        generated_at: { type: string, format: date-time }

    DashboardCustomerActivityStatusCount:
      type: object
      required: [surface_status, payment_count]
      properties:
        surface_status:
          type: string
          enum: [awaiting, processing, delayed, needs_review, completed, failed_safely, expired]
          description: Merchant-facing status bucket of the Core payments.
        payment_count: { type: integer, minimum: 0 }

    DashboardCustomerActivitySummary:
      type: object
      required: [payment_count, amount_usdc, status_counts]
      properties:
        payment_count: { type: integer, minimum: 0 }
        amount_usdc:
          type: string
          description: USDC share only - the requested amounts of this customer_reference's Core payments requested in USDC, in atomic units. Totals per currency are in amount_totals.
        status_counts:
          type: array
          items: { $ref: "#/components/schemas/DashboardCustomerActivityStatusCount" }
        first_seen_at: { type: string, format: date-time }
        last_seen_at:  { type: string, format: date-time }

    DashboardCustomerActivityPage:
      type: object
      description: |
        First Customer-360 slice: merchant/mode-scoped Core payment
        activity for one merchant-supplied customer_reference. The rows
        are the reconciliation rows and never expose private material.
      required: [customer_reference, summary, items, generated_at]
      properties:
        customer_reference:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        summary: { $ref: "#/components/schemas/DashboardCustomerActivitySummary" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardReconciliationView" }
        generated_at: { type: string, format: date-time }

    DashboardSessionView:
      type: object
      description: |
        Mirrors `domain.MerchantDashboardSessionView` - the merchant-
        facing redacted projection of a CheckoutSession. Distinct
        from the customer-browser WidgetSessionView: this surface
        carries correlation IDs the merchant already owns.
      required:
        - session_id
        - payment_id
        - state
        - next_action
        - expires_at
      properties:
        session_id:        { type: string }
        payment_id:        { type: string }
        state:             { type: string, description: "Raw CheckoutSessionState." }
        next_action:       { type: string, description: "Same widget-side terminal-vs-live classification enum." }
        wallet_address:    { type: string, description: "Set once the user has bound a wallet." }
        chain_id:          { type: string }
        submitted_tx_hash: { type: string, description: "User-signed tx hash (on-chain public) - never stored secret material." }
        failure_code:      { type: string, description: "Bounded failure-reason code; reuses the widget-view mapping." }
        expires_at:        { type: string, format: date-time }
        quote_expires_at:  { type: string, format: date-time }
        terminal_at:       { type: string, format: date-time }
        mode:              { type: string, enum: [test, live] }

    DashboardSessionsPage:
      type: object
      required: [items, has_more, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardSessionView" }
        has_more:     { type: boolean }
        next_cursor:  { type: string }
        generated_at: { type: string, format: date-time }

    DashboardAuditEventView:
      type: object
      description: |
        Merchant-facing account activity row. This is a deliberately
        redacted projection over merchant_account_audit_events: it never
        exposes idempotency keys, metadata JSON, raw DD/KYB review
        reasons, operator notes, or cross-merchant identifiers.
      required: [event_id, event_type, actor_type, created_at]
      properties:
        event_id:   { type: string }
        event_type:
          type: string
          description: Bounded account event name.
          enum:
            - merchant.created
            - merchant.approved
            - merchant.needs_info
            - merchant.info_resolved
            - merchant.profile_submitted
            - invitation.created
            - invitation.revoked
            - policy.change_requested
            - member.bound
            - role.changed
            - api_key.created
            - webhook_endpoint.created
            - live_mode.enabled
        actor_type:
          type: string
          enum: [operator, system, merchant_user]
        target_type:
          type: string
          description: Optional bounded target type, never raw metadata.
        target_id:
          type: string
          description: Optional target identifier that belongs to the authenticated merchant account.
        created_at: { type: string, format: date-time }

    DashboardAuditEventsPage:
      type: object
      description: |
        Account-level audit activity for the authenticated merchant. It
        is merchant-scoped but not test/live-mode-scoped because profile,
        membership, API-key, webhook, and live-access events are account
        control-plane activity, not payment ledger rows.
      required: [items, has_more, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardAuditEventView" }
        has_more:     { type: boolean }
        next_cursor:  { type: string }
        generated_at: { type: string, format: date-time }

    DashboardTeamMemberView:
      type: object
      description: |
        Merchant-facing team member row. This projection never exposes
        OIDC issuer, OIDC subject, or cross-merchant membership rows.
      required: [member_id, role, status, created_at, updated_at]
      properties:
        member_id:  { type: string }
        email:
          type: string
          format: email
          description: Email is present only when it can be derived from merchant invitation records.
        role:
          type: string
          enum: [owner, admin, developer, finance, viewer, support]
        status:
          type: string
          enum: [active, revoked]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    DashboardTeamInvitationView:
      type: object
      description: |
        Merchant-facing team invitation row. It never exposes
        invitation_token_hash or plaintext invitation tokens.
      required: [invitation_id, email, role, status, created_at, expires_at]
      properties:
        invitation_id: { type: string }
        email:         { type: string, format: email }
        role:
          type: string
          enum: [owner, admin, developer, finance, viewer, support]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        created_at:  { type: string, format: date-time }
        expires_at:  { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
        revoked_at:  { type: string, format: date-time }

    DashboardTeamAccessPage:
      type: object
      description: |
        Account-level team access snapshot for the authenticated
        merchant. Team state is merchant-scoped but not test/live-mode
        scoped. The response omits identity-provider internals,
        invitation token material, and operator-only review context.
      required: [members, invitations, generated_at]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/DashboardTeamMemberView" }
        invitations:
          type: array
          items: { $ref: "#/components/schemas/DashboardTeamInvitationView" }
        generated_at: { type: string, format: date-time }

    DashboardTeamInvitationInput:
      type: object
      description: |
        Merchant-user request to create a pending dashboard invitation.
        The gateway resolves merchant_id, actor subject, and idempotency
        from the authenticated dashboard context. Plaintext invitation
        tokens are never returned; invited users join by signing in with
        the same verified email.
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum: [admin, developer, finance, viewer, support]
          description: Owner invitations require a separate reviewed ownership-transfer flow.

    DashboardTeamMemberRoleInput:
      type: object
      description: |
        Merchant-user request to change an active non-owner team member's
        dashboard role. The gateway resolves merchant_id, actor subject,
        and idempotency from the authenticated dashboard context. Owner
        role assignment and ownership transfer are deliberately outside
        this endpoint.
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, developer, finance, viewer, support]
          description: Owner role changes require a separate reviewed ownership-transfer flow.

    DashboardNotificationPreferencesInput:
      type: object
      description: |
        Merchant-user dashboard notification-routing preferences. This
        contract stores dashboard signal routing only; it does not
        configure or claim email, Slack, pager, or provider-side
        delivery.
      required:
        - payment_exceptions_enabled
        - webhook_failures_enabled
        - account_review_enabled
        - minimum_severity
      properties:
        payment_exceptions_enabled:
          type: boolean
        webhook_failures_enabled:
          type: boolean
        account_review_enabled:
          type: boolean
        minimum_severity:
          type: string
          enum: [watch, action_required]

    DashboardNotificationPreferencesView:
      type: object
      description: |
        Saved dashboard notification-routing preferences for the
        authenticated merchant and mode. `source=default` means no
        merchant-saved preference row exists yet.
      required:
        - mode
        - payment_exceptions_enabled
        - webhook_failures_enabled
        - account_review_enabled
        - minimum_severity
        - source
        - generated_at
      properties:
        mode:
          type: string
          enum: [test, live]
        payment_exceptions_enabled:
          type: boolean
        webhook_failures_enabled:
          type: boolean
        account_review_enabled:
          type: boolean
        minimum_severity:
          type: string
          enum: [watch, action_required]
        source:
          type: string
          enum: [default, merchant]
        updated_at:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time

    DashboardPolicyChangeRequestInput:
      type: object
      description: |
        Merchant-user settlement-policy change request. The gateway
        resolves merchant_id, mode, dashboard role, actor subject, and
        idempotency from the authenticated dashboard context; callers
        cannot apply policy by submitting this body.
      required:
        - asset_in
        - preferred_dest_chain
        - speed
        - risk_tolerance
        - provider_outage
      properties:
        asset_in:
          type: string
          enum: [USDC]
        preferred_dest_chain:
          type: string
          enum: [ethereum, base, arbitrum, polygon]
        speed:
          type: string
          enum: [standard, fast]
        risk_tolerance:
          type: string
          enum: [conservative, liberal]
        provider_outage:
          type: string
          enum: [freeze, try_alternate]
        note:
          type: string
          maxLength: 1000
          description: Optional support-review note. Do not send secrets, customer personal data, or provider credentials.

    DashboardPolicyChangeRequestView:
      type: object
      description: |
        Redacted evidence that a settlement-policy change request was
        submitted for review. This is not the active merchant policy and
        does not imply any routing or live-settlement change.
      required:
        - request_id
        - mode
        - status
        - asset_in
        - preferred_dest_chain
        - speed
        - risk_tolerance
        - provider_outage
        - created_at
        - updated_at
      properties:
        request_id: { type: string }
        mode: { type: string, enum: [test, live] }
        status: { type: string, enum: [submitted, approved, rejected, cancelled] }
        asset_in: { type: string, enum: [USDC] }
        preferred_dest_chain: { type: string, enum: [ethereum, base, arbitrum, polygon] }
        speed: { type: string, enum: [standard, fast] }
        risk_tolerance: { type: string, enum: [conservative, liberal] }
        provider_outage: { type: string, enum: [freeze, try_alternate] }
        note: { type: string, maxLength: 1000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DashboardWebhookEndpointView:
      type: object
      description: |
        Mirrors `domain.MerchantDashboardWebhookEndpointView` - the
        dashboard-side redacted projection. Differs from the IDX
        WebhookEndpoint shape by surfacing `has_secret` instead of
        any secret material.
      required:
        - endpoint_id
        - url
        - enabled
        - has_secret
        - secret_rotation_due
        - secret_grace_active
        - secret_rotation_cadence
        - created_at
        - updated_at
      properties:
        endpoint_id: { type: string }
        url:         { type: string, format: uri }
        events:
          type: array
          items: { type: string }
          description: "Subscribed event types; empty array = wildcard."
        enabled:     { type: boolean }
        has_secret:  { type: boolean, description: "True iff a rotatable signing secret is currently on the row (envelope columns populated)." }
        secret_last_rotated_at:
          type: string
          format: date-time
          description: "Last signing-secret rotation timestamp, omitted for legacy rows where the rotation timestamp is unknown."
        secret_rotation_due_at:
          type: string
          format: date-time
          description: "Computed quarterly rotation due timestamp when the last rotation timestamp is known."
        secret_rotation_due:
          type: boolean
          description: "True when the endpoint is past the quarterly signing-secret rotation window."
        secret_grace_until:
          type: string
          format: date-time
          description: "Secondary signing-secret grace-window expiry, if a rotate is in progress."
        secret_grace_active:
          type: boolean
          description: "True while the previous signing secret is still accepted during the rotate grace window."
        secret_rotation_cadence:
          type: string
          enum: [quarterly]
          description: "Merchant-facing label for the ADR 0050 signing-secret rotation cadence."
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    DashboardWebhookEndpointsPage:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardWebhookEndpointView" }
        generated_at: { type: string, format: date-time }

    DashboardWebhookDeliveryView:
      type: object
      description: |
        Mirrors `domain.MerchantDashboardWebhookDeliveryView`. Hard-
        redacted: signing material, raw body bytes, sig timestamp,
        signature hex, and merchant_id are all absent - this surface
        is for correlation + diagnostics, not for replay (replay
        uses the IDX `/replay` endpoint).
      required:
        - delivery_id
        - payment_id
        - endpoint_id
        - event_type
        - event_id
        - state
        - attempt_count
        - created_at
      properties:
        delivery_id:   { type: string }
        payment_id:    { type: string }
        endpoint_id:   { type: string }
        event_type:    { type: string }
        event_id:      { type: string, description: "Idempotency key the merchant dedupes on at their receiving side." }
        state:
          type: string
          enum: [pending, delivered, failed]
          description: "Mirrors the outbox row state. The internal SELECT-FOR-UPDATE-SKIP-LOCKED 'dispatched' / 'in_flight' transitions are deliberately not surfaced."
        attempt_count: { type: integer, minimum: 0 }
        http_status:   { type: integer, description: "Last observed HTTP status; zero before any attempt has landed." }
        last_error:    { type: string, description: "Bounded reason code (WHK-I4); never raw response text." }
        created_at:    { type: string, format: date-time }
        delivered_at:  { type: string, format: date-time, description: "Set when the row reaches 'delivered'; absent while pending/failed." }

    DashboardWebhookDeliveriesPage:
      type: object
      required: [items, has_more, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardWebhookDeliveryView" }
        has_more:     { type: boolean }
        next_cursor:  { type: string }
        generated_at: { type: string, format: date-time }

    DashboardWebhookHealthWindow:
      type: object
      required: [created_from, created_to]
      properties:
        created_from: { type: string, format: date-time, description: "Start of the bounded delivery window, inclusive." }
        created_to:   { type: string, format: date-time, description: "End of the bounded delivery window, exclusive." }

    DashboardWebhookEndpointHealthView:
      type: object
      description: |
        Redacted per-endpoint health projection for the merchant dashboard.
        It is derived from webhook_endpoints plus bounded webhook_outbox
        counters. It never returns signing secrets, webhook bodies,
        signatures, raw response text, or cross-merchant identifiers.
      required:
        - endpoint_id
        - url
        - enabled
        - delivery_count
        - delivered_count
        - failed_count
        - pending_count
      properties:
        endpoint_id:      { type: string }
        url:              { type: string, format: uri }
        enabled:          { type: boolean }
        delivery_count:   { type: integer, minimum: 0 }
        delivered_count:  { type: integer, minimum: 0 }
        failed_count:     { type: integer, minimum: 0 }
        pending_count:    { type: integer, minimum: 0 }
        last_state:       { type: string, enum: [pending, delivered, failed] }
        last_http_status: { type: integer, minimum: 100, maximum: 599 }
        last_error:       { type: string, description: "Bounded delivery reason code, never raw response text." }
        last_event_at:    { type: string, format: date-time }

    DashboardWebhookHealthSummary:
      type: object
      description: |
        Real Overview metric contract for webhook delivery health over a
        bounded 24h window. Merchant and mode are resolved from auth
        context. This response is intentionally limited to webhook health;
        it does not claim rail volume, success rate, settlement latency, or
        chain health.
      required:
        - window
        - total_endpoint_count
        - enabled_endpoint_count
        - delivery_count
        - delivered_count
        - failed_count
        - pending_count
        - endpoints
        - generated_at
      properties:
        window:                 { $ref: "#/components/schemas/DashboardWebhookHealthWindow" }
        total_endpoint_count:   { type: integer, minimum: 0 }
        enabled_endpoint_count: { type: integer, minimum: 0 }
        delivery_count:         { type: integer, minimum: 0 }
        delivered_count:        { type: integer, minimum: 0 }
        failed_count:           { type: integer, minimum: 0 }
        pending_count:          { type: integer, minimum: 0 }
        last_event_at:          { type: string, format: date-time }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/DashboardWebhookEndpointHealthView" }
        generated_at:           { type: string, format: date-time }

    DashboardReconciliationView:
      type: object
      description: |
        Mirrors `domain.MerchantDashboardReconciliationView` - one
        merchant-facing reconciliation row of a Core payment. The shape is
        unchanged; the CCTP-only fields (intent_id, amount_usdc,
        source_chain, dest_chain) are empty since the CCTP intents are
        retired with R1. Proofs and checkout token hashes are deliberately
        absent.
      required:
        - intent_id
        - amount_usdc
        - asset
        - source_chain
        - dest_chain
        - surface_status
        - requested_at
        - expires_at
        - received_at
        - routed_at
        - settled_at
        - drift_reason
      properties:
        intent_id:          { type: string, description: "Payment-intent UUID." }
        merchant_order_id:  { type: string, description: "Merchant-supplied order/deposit reference." }
        customer_reference: { type: string, description: "Merchant-supplied customer/support reference." }
        amount_usdc:        { type: string, description: "Atomic USDC units (6 decimals)." }
        asset:              { type: string, enum: [USDC] }
        source_chain:       { type: string }
        dest_chain:         { type: string }
        surface_status:
          type: string
          enum: [awaiting, processing, delayed, needs_review, completed, failed_safely, expired]
        requested_at:       { type: string, format: date-time }
        expires_at:         { type: string, format: date-time }
        received_at:        { type: string, format: date-time, nullable: true }
        routed_at:          { type: string, format: date-time, nullable: true }
        settled_at:         { type: string, format: date-time, nullable: true }
        drift_reason:
          type: string
          nullable: true
          description: "Bounded merchant-facing phrase; null for normal in-progress or settled rows."

    DashboardReconciliationPage:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardReconciliationView" }
        generated_at: { type: string, format: date-time }

    DashboardReconciliationEvidenceView:
      type: object
      description: |
        Bounded technical evidence for one reconciliation detail page.
        It exposes merchant-verifiable transaction references, but
        never raw attestation bytes, CCTP message bytes, hook_payment_id,
        route_hash, or internal state names.
      required:
        - settlement_contract
        - cctp_version
        - finality_mode
      properties:
        source_tx_hash:
          type: string
          pattern: '^0x[a-f0-9]{64}$'
        settlement_tx_hash:
          type: string
          pattern: '^0x[a-f0-9]{64}$'
        settlement_contract:
          type: string
          pattern: '^0x[a-f0-9]{40}$'
        cctp_version: { type: integer, enum: [2] }
        finality_mode: { type: string, enum: [fast, standard] }

    DashboardReconciliationDetailView:
      type: object
      description: |
        Click-through reconciliation view for one CCTP payment intent.
        The CCTP intents are retired with R1: the endpoint answers not
        found for every id. Core payments are read through the payment
        detail.
      required:
        - intent_id
        - amount_usdc
        - asset
        - source_chain
        - dest_chain
        - surface_status
        - requested_at
        - expires_at
        - received_at
        - routed_at
        - settled_at
        - drift_reason
        - updated_at
      properties:
        intent_id:          { type: string, description: "Payment-intent UUID." }
        merchant_order_id:  { type: string, description: "Merchant-supplied order/deposit reference." }
        customer_reference: { type: string, description: "Merchant-supplied customer/support reference." }
        amount_usdc:        { type: string, description: "Atomic USDC units (6 decimals)." }
        asset:              { type: string, enum: [USDC] }
        source_chain:       { type: string }
        dest_chain:         { type: string }
        surface_status:
          type: string
          enum: [awaiting, processing, delayed, needs_review, completed, failed_safely, expired]
        requested_at:       { type: string, format: date-time }
        expires_at:         { type: string, format: date-time }
        received_at:        { type: string, format: date-time, nullable: true }
        routed_at:          { type: string, format: date-time, nullable: true }
        settled_at:         { type: string, format: date-time, nullable: true }
        drift_reason:
          type: string
          nullable: true
          description: "Bounded merchant-facing phrase; null for normal in-progress or settled rows."
        evidence:
          $ref: "#/components/schemas/DashboardReconciliationEvidenceView"
        updated_at: { type: string, format: date-time }

    DashboardSettlementReconciliationWindow:
      type: object
      required: [created_from, created_to]
      properties:
        created_from: { type: string, format: date-time }
        created_to: { type: string, format: date-time }
        dest_chain: { type: string, enum: [ethereum, base, arbitrum, polygon] }
        settlement_contract:
          type: string
          pattern: '^0x[a-f0-9]{40}$'
        merchant_wallet:
          type: string
          pattern: '^0x[a-f0-9]{40}$'

    DashboardSettlementLedgerSummary:
      type: object
      required:
        - payment_count
        - settled_count
        - gross_amount_usdc
        - merchant_amount_captured_atomic
        - fee_delta_atomic
        - incomplete_settlement_amount_count
        - stuck_count
        - failed_count
        - expired_count
      properties:
        payment_count:
          type: integer
          minimum: 0
          description: Rows of the retired CCTP intent ledger; always 0 since R1 (see unavailable_reason).
        settled_count:
          type: integer
          minimum: 0
          description: Rows in the window whose status is SETTLED and whose mint_tx_hash is present.
        gross_amount_usdc:
          type: string
          pattern: '^[0-9]+$'
          description: Gross CCTP USDC atomic units summed from amount_usdc for settled rows only.
        merchant_amount_captured_atomic:
          type: string
          pattern: '^[0-9]+$'
          description: Merchant-net USDC atomic units summed from merchant_amount_captured_atomic for settled rows only.
        fee_delta_atomic:
          type: string
          pattern: '^[0-9]+$'
          description: Derived gross minus merchant-net atomic USDC for settled rows with captured merchant amount.
        incomplete_settlement_amount_count:
          type: integer
          minimum: 0
          description: Settled rows missing merchant_amount_captured_atomic; non-zero means the ledger total is incomplete.
        stuck_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }
        expired_count: { type: integer, minimum: 0 }

    DashboardSettlementOnChainSummary:
      type: object
      required:
        - status
        - event_count
        - merchant_amount_atomic
        - chainmore_fee_atomic
        - distinct_tx_count
      properties:
        status:
          type: string
          enum: [matched, ledger_ahead, chain_ahead, partial, unavailable]
        unavailable_reason:
          type: string
          description: Present when route/RPC event evidence is not configured.
        event_count: { type: integer, minimum: 0 }
        merchant_amount_atomic:
          type: string
          pattern: '^[0-9]+$'
        chainmore_fee_atomic:
          type: string
          pattern: '^[0-9]+$'
        distinct_tx_count: { type: integer, minimum: 0 }
        first_scanned_block: { type: integer, minimum: 0 }
        last_scanned_block: { type: integer, minimum: 0 }
        scanned_at: { type: string, format: date-time }

    DashboardSettlementReconciliationResult:
      type: object
      required: [status, message, next_action]
      properties:
        status:
          type: string
          enum: [matched, ledger_ahead, chain_ahead, partial, unavailable]
        message:
          type: string
        next_action:
          type: string

    DashboardSettlementReconciliationSummary:
      type: object
      description: |
        Aggregate Finance reconciliation snapshot for a bounded period.
        Merchant and mode are resolved from auth context. The ledger valued
        the CCTP intents retired with R1: it reports no values and says so
        in unavailable_reason, and it counts the settled Core payments per
        currency in settled_outside_ledger. The on-chain comparison is
        unavailable.
      required: [window, ledger, on_chain, result, generated_at]
      properties:
        window: { $ref: "#/components/schemas/DashboardSettlementReconciliationWindow" }
        ledger: { $ref: "#/components/schemas/DashboardSettlementLedgerSummary" }
        on_chain: { $ref: "#/components/schemas/DashboardSettlementOnChainSummary" }
        result: { $ref: "#/components/schemas/DashboardSettlementReconciliationResult" }
        generated_at: { type: string, format: date-time }

    DashboardRouteLedgerWindow:
      type: object
      required: [created_from, created_to]
      properties:
        created_from: { type: string, format: date-time }
        created_to: { type: string, format: date-time }

    DashboardRouteLedgerRow:
      type: object
      required:
        - source_chain
        - dest_chain
        - payment_count
        - settled_count
        - stuck_count
        - failed_count
        - expired_count
        - requested_amount_usdc
        - settled_amount_usdc
        - merchant_amount_captured_atomic
        - fee_delta_atomic
      properties:
        source_chain:
          type: string
          description: Source chain of a retired CCTP intent route; no rows since R1.
        dest_chain:
          type: string
          description: Destination chain of a retired CCTP intent route; no rows since R1.
        payment_count:
          type: integer
          minimum: 0
          description: Payment-intent rows in the bounded created_at window for this route.
        settled_count:
          type: integer
          minimum: 0
          description: Rows whose status is SETTLED and whose mint_tx_hash is present.
        stuck_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }
        expired_count: { type: integer, minimum: 0 }
        requested_amount_usdc:
          type: string
          pattern: '^[0-9]+$'
          description: Gross USDC atomic units summed from amount_usdc for all rows in this route/window.
        settled_amount_usdc:
          type: string
          pattern: '^[0-9]+$'
          description: Gross USDC atomic units summed from amount_usdc for settled rows only.
        merchant_amount_captured_atomic:
          type: string
          pattern: '^[0-9]+$'
          description: Merchant-net USDC atomic units summed from merchant_amount_captured_atomic for settled rows only.
        fee_delta_atomic:
          type: string
          pattern: '^[0-9]+$'
          description: Derived gross minus merchant-net atomic USDC for settled rows with captured merchant amount.

    DashboardRouteLedgerSummary:
      type: object
      description: |
        Route-level ledger aggregate over the CCTP intent routes. Those
        routes are retired with R1: the shape stays for a bounded window
        and carries no rows. It never claimed provider success rates,
        latency, or route availability.
      required: [window, items, generated_at]
      properties:
        window: { $ref: "#/components/schemas/DashboardRouteLedgerWindow" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardRouteLedgerRow" }
        generated_at: { type: string, format: date-time }

    DashboardRouteHealthWindow:
      type: object
      required: [created_from, created_to]
      properties:
        created_from: { type: string, format: date-time }
        created_to: { type: string, format: date-time }

    DashboardRouteLatencyQuantiles:
      type: object
      required: [p50, p95, p99]
      properties:
        p50:
          type: integer
          minimum: 0
          description: Median seconds from payment intent creation to SETTLED state-history event.
        p95:
          type: integer
          minimum: 0
          description: 95th percentile seconds from payment intent creation to SETTLED state-history event.
        p99:
          type: integer
          minimum: 0
          description: 99th percentile seconds from payment intent creation to SETTLED state-history event.

    DashboardRouteHealthRow:
      type: object
      required:
        - source_chain
        - dest_chain
        - payment_count
        - settled_count
        - active_count
        - failed_count
        - expired_count
        - needs_attention_count
        - completion_rate_bps
        - settlement_latency_sample_count
      properties:
        source_chain:
          type: string
          description: Source chain of a retired CCTP intent route; no rows since R1.
        dest_chain:
          type: string
          description: Destination chain of a retired CCTP intent route; no rows since R1.
        payment_count:
          type: integer
          minimum: 0
          description: Payment-intent rows in the bounded created_at window for this route.
        settled_count:
          type: integer
          minimum: 0
          description: Rows whose status is SETTLED and whose SETTLED state-history timestamp is present.
        active_count:
          type: integer
          minimum: 0
          description: Non-terminal rows that are neither SETTLED, FAILED, nor EXPIRED.
        failed_count: { type: integer, minimum: 0 }
        expired_count: { type: integer, minimum: 0 }
        needs_attention_count:
          type: integer
          minimum: 0
          description: Rows that are failed, expired, or in a stuck internal state. Raw internal states are not emitted.
        completion_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Settled rows divided by all rows for this route/window, expressed in basis points.
        settlement_latency_seconds:
          $ref: "#/components/schemas/DashboardRouteLatencyQuantiles"
        settlement_latency_sample_count:
          type: integer
          minimum: 0
          description: Count of settled rows with usable created_at and SETTLED timestamps.

    DashboardRouteHealthSummary:
      type: object
      description: |
        Backend-only route-health projection over the CCTP intent routes.
        Those routes are retired with R1: the shape stays for a bounded
        window and carries no rows.
      required: [window, items, generated_at]
      properties:
        window: { $ref: "#/components/schemas/DashboardRouteHealthWindow" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardRouteHealthRow" }
        generated_at: { type: string, format: date-time }

    DashboardExportJobPaymentsFilter:
      type: object
      description: |
        Filter for an async payments export. Merchant and mode are never
        accepted here; they come from auth context. created_from and
        created_to are required so large exports stay bounded.
      required: [created_from, created_to]
      additionalProperties: false
      properties:
        q:
          type: string
          maxLength: 128
          description: Exact lookup by merchant_order_id or ChainMore payment_id.
        status:
          type: string
          description: Merchant-facing payment status filter. Refund lifecycle values are reserved for reviewed, non-automatic remediation flows and are not accepted as export filters until the refund backend is implemented.
          enum:
            - payment_created
            - checkout_started
            - authorization_pending
            - authorized
            - executing
            - completed
            - failed
            - expired
        created_from:
          type: string
          description: Inclusive created_at lower bound. Accepts YYYY-MM-DD or RFC3339.
        created_to:
          type: string
          description: Exclusive created_at upper bound. YYYY-MM-DD values include that calendar day.

    DashboardExportJobCreateRequest:
      type: object
      required: [export_type, format, filter]
      additionalProperties: false
      properties:
        export_type:
          type: string
          enum: [payments]
        format:
          type: string
          enum: [csv, jsonl]
        filter:
          $ref: "#/components/schemas/DashboardExportJobPaymentsFilter"

    DashboardExportJobView:
      type: object
      description: |
        Redacted async export job status. It does not expose merchant_id,
        filter_json, idempotency_key, storage_uri, or raw failure_message.
      required:
        - export_id
        - export_type
        - format
        - status
        - mode
        - filter_hash
        - created_at
        - expires_at
        - updated_at
      properties:
        export_id: { type: string, format: uuid }
        export_type: { type: string, enum: [payments] }
        format: { type: string, enum: [csv, jsonl] }
        status: { type: string, enum: [queued, running, succeeded, failed, expired, cancelled] }
        mode: { type: string, enum: [test, live] }
        filter_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        row_count: { type: integer, format: int64, minimum: 0 }
        byte_count: { type: integer, format: int64, minimum: 0 }
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        failure_code:
          type: string
          description: Bounded failure code when a worker marks the job failed; raw failure messages are not exposed.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DashboardExportJobsPage:
      type: object
      description: |
        Recent async export jobs for the authenticated merchant and mode.
        Items use the same redacted job projection as the status endpoint;
        storage_uri, filter_json, idempotency_key, and raw failure_message
        remain server-side.
      required: [items, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardExportJobView" }
        generated_at: { type: string, format: date-time }

    # ── Merchant Integration control plane (IDX-M2 / IDX-M4) ─────────────────
    APIKey:
      type: object
      description: |
        Projection of an `api_keys` row. Never carries the secret -
        that is present only in the one-shot response of create /
        rotate and never re-derivable thereafter.
      required: [id, merchant_id, name, mode, key_prefix, status, created_at]
      properties:
        id:           { type: string }
        merchant_id:  { type: string }
        name:         { type: string }
        mode:         { type: string, enum: [test, live] }
        key_prefix:   { type: string, description: "First 9 characters of the plaintext key; safe to display." }
        status:       { type: string, enum: [active, revoked] }
        rotated_from: { type: string }
        created_at:   { type: string, format: date-time }
        revoked_at:   { type: string, format: date-time }

    CreateKeyRequest:
      type: object
      description: |
        Body for `POST /v1/keys`. IDX-I2: the new key gets the mode
        selected in the dashboard session that calls this endpoint. A
        `mode` field in the body is ignored.
      properties:
        name: { type: string, description: "Human-readable label." }

    CreateKeyResponse:
      type: object
      required: [api_key, secret]
      properties:
        api_key: { $ref: "#/components/schemas/APIKey" }
        secret:
          type: string
          description: |
            Plaintext `cm_{mode}_{hex}` secret. Present only in this
            response; the server persists only `sha256(secret)`.

    ListKeysResponse:
      type: object
      required: [api_keys, mode]
      properties:
        api_keys:
          type: array
          items: { $ref: "#/components/schemas/APIKey" }
        mode: { type: string, enum: [test, live] }

    RotateKeyResponse:
      type: object
      required: [api_key, secret, predecessor]
      properties:
        api_key:     { $ref: "#/components/schemas/APIKey" }
        secret:      { type: string, description: "Plaintext of the new key - returned once." }
        predecessor: { $ref: "#/components/schemas/APIKey" }

    WebhookEndpoint:
      type: object
      required:
        - id
        - merchant_id
        - url
        - events
        - enabled
        - mode
        - secret_rotation_due
        - secret_grace_active
        - secret_rotation_cadence
        - created_at
      properties:
        id:          { type: string }
        merchant_id: { type: string }
        url:         { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        enabled:     { type: boolean }
        mode:        { type: string, enum: [test, live] }
        secret_last_rotated_at:
          type: string
          format: date-time
          description: "Last signing-secret rotation timestamp, omitted for legacy rows where the rotation timestamp is unknown."
        secret_rotation_due_at:
          type: string
          format: date-time
          description: "Computed quarterly rotation due timestamp when the last rotation timestamp is known."
        secret_rotation_due:
          type: boolean
          description: "True when the endpoint is past the quarterly signing-secret rotation window."
        secret_grace_until:
          type: string
          format: date-time
          description: "Secondary signing-secret grace-window expiry, if a rotate is in progress."
        secret_grace_active:
          type: boolean
          description: "True while the previous signing secret is still accepted during the rotate grace window."
        secret_rotation_cadence:
          type: string
          enum: [quarterly]
          description: "Merchant-facing label for the ADR 0050 signing-secret rotation cadence."
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    CreateEndpointRequest:
      type: object
      required: [url, events]
      description: |
        Body for `POST /v1/webhook_endpoints`. IDX-I2: the endpoint gets
        the mode selected in the dashboard session that calls this
        endpoint. A `mode` field in the body is ignored. Non-https URLs
        are rejected.
      properties:
        url:
          type: string
          format: uri
          description: "Must be an https URL."
        events:
          type: array
          description: |
            Event types to subscribe to: `payment.settled`,
            `payment.expired`, `payment.late_payment_received`,
            `payment.delivery_delayed`. An empty list receives
            `payment.settled` only. `payment.expired`,
            `payment.late_payment_received` and `payment.delivery_delayed`
            reach only endpoints that list them by name.
          items: { type: string }

    CreateEndpointResponse:
      type: object
      required: [webhook_endpoint, secret]
      properties:
        webhook_endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        secret:
          type: string
          description: |
            Plaintext `whsec_{hex}` signing secret. Present only in
            this response; the server persists the envelope-encrypted
            ciphertext and the caller must store this value in their
            own secret manager.

    UpdateEndpointRequest:
      type: object
      description: |
        Partial update. Any field omitted is left unchanged. `mode`
        is NOT updatable - rotate a new endpoint instead.
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items: { type: string }
        enabled:
          type: boolean

    ListEndpointsResponse:
      type: object
      required: [webhook_endpoints, mode]
      properties:
        webhook_endpoints:
          type: array
          items: { $ref: "#/components/schemas/WebhookEndpoint" }
        mode: { type: string, enum: [test, live] }

    # ── Webhook delivery bodies (merchant consumes) ──────────────────────────
    # Each schema lists exactly the fields its producer writes; a test
    # (cmd/openapi-drift-check, webhook_schema_test.go) compares them.
    WebhookEvent:
      type: object
      description: |
        Body of the `payment.*` events. The signature is HMAC-SHA256 with
        the endpoint's `whsec_*` secret over the `X-ChainMore-Timestamp`
        header value, a dot, and the exact raw body bytes; it is carried
        in the `X-ChainMore-Signature` header as lowercase hex. While a
        rotated secret is still valid, `X-ChainMore-Signature-Previous`
        carries the signature with that secret. `X-ChainMore-Event-ID`
        repeats `event_id`. See https://chainmore.io/docs#webhooks for
        the verification snippet.

        Delivery is at least once: a retried delivery carries the same
        `event_id`, so dedupe by it. Existing fields keep their name and
        meaning; new fields may be added.
      required: [schema_version, event_type, occurred_at, payment_id, merchant_id, state, amount]
      properties:
        schema_version:
          type: integer
          description: |
            Version of this body, `1`. A replay of a delivery written
            before the field existed carries `0`; its other fields are
            the same.
        event_type:
          type: string
          enum: [payment.settled, payment.failed, payment.expired, payment.late_payment_received, payment.delivery_delayed]
        event_id:
          type: string
          description: "Delivery identity, set on every delivery. A replay has a new one."
        occurred_at: { type: string, format: date-time }
        payment_id: { type: string }
        merchant_id: { type: string }
        merchant_order_id: { type: string }
        state:
          type: string
          description: |
            The state the event reports: `settled`, `failed`, `expired`,
            `late_payment_received` or `delivery_delayed`.
        failure_code:
          type: string
          description: "Machine-readable reason of `payment.expired`; absent otherwise."
        amount:
          type: object
          description: |
            The amount the payment requested. For
            `payment.late_payment_received` this is not the amount of the
            further transfer; that one is in `transfer`.
          required: [minor, currency]
          properties:
            minor: { type: integer, format: int64 }
            currency: { type: string }
            asset: { type: string }
        transfer:
          type: object
          description: |
            Only on `payment.late_payment_received`: the further on-chain
            transfer. `amount_atomic` is what it moved to the merchant's
            address, in the token's base units on that chain;
            `amount_decimals` is that token's scale there (6, or 18 for USDT
            on BNB Chain). Absent on every other event.
          required: [chain_id, tx_hash, log_index, amount_atomic, amount_decimals]
          properties:
            chain_id: { type: integer, format: int64 }
            tx_hash: { type: string, description: "Lowercase hex." }
            log_index: { type: integer, format: int64 }
            amount_atomic: { type: string, pattern: '^[0-9]+$' }
            amount_decimals: { type: integer, minimum: 6, maximum: 18 }
            asset: { type: string }
        test_event:
          type: boolean
          description: "`true` on a test event from `POST /v1/webhook_endpoints/{id}/test`; absent otherwise."
        replayed_from_event_id:
          type: string
          description: "On a replay, the `event_id` of the original delivery; absent otherwise."

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated principal is not allowed to perform this action.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        State/precondition conflict - e.g. CKO state disallows the
        requested transition (CKO-I2/I3), validation precondition
        unmet, or dispatch gate refused.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: Resource has expired (e.g. quote or session TTL passed).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplemented:
      description: |
        The route exists but its productive path is not configured on this
        deployment (e.g. the sandbox card ingress without PAYSAFE_CARD_CHECKOUT_MOUNT).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Request refused by the fixed-window limiter.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServerMisconfigured:
      description: Server-side configuration is missing or inconsistent.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

# ---------------------------------------------------------------------------
# Paths
#
# NOTE: Each top-level path key is indented with exactly two spaces; each
# method under it is indented with exactly four. The drift-checker parser
# relies on this formatting - preserve it on edits.
# ---------------------------------------------------------------------------
paths:
  /health:
    get:
      summary: Liveness probe.
      operationId: health
      security: []
      responses:
        '200':
          description: Service is listening.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /internal/providers/paysafe/webhooks:
    post:
      summary: Receive Paysafe sandbox webhooks.
      operationId: receivePaysafeWebhook
      security: []
      description: |
        Provider callback ingress authenticated by Paysafe's `Signature`
        header, not by a ChainMore merchant bearer. The receiver verifies
        Base64(HMAC-SHA256(webhook secret, raw JSON body)) before parsing,
        applies timestamp freshness when configured, and records provider
        event ids through the persistent idempotency guard before running
        callback logic.

        Current implementation is sandbox-gated at gateway boot:
        `PAYSAFE_WEBHOOK_MOUNT=true` refuses unless
        `PAYSAFE_ENVIRONMENT=sandbox`. Production webhook ingestion requires
        a separate approval and wiring pass.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - name: Signature
          in: header
          required: true
          schema: { type: string }
          description: Exactly one Paysafe Base64 HMAC-SHA256 signature over the raw JSON request body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Webhook accepted or duplicate event already recorded.
        '400':
          description: Invalid payload, missing/stale timestamp, or malformed webhook event.
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: Invalid webhook signature.
          content:
            text/plain:
              schema: { type: string }
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema: { type: string }
        '413':
          description: Webhook body exceeds the receiver limit.
          content:
            text/plain:
              schema: { type: string }
        '500':
          description: Idempotency persistence or callback processing failed.
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Webhook secret or durable persistence is not configured.
          content:
            text/plain:
              schema: { type: string }

  /v1/public/merchant-intake:
    post:
      summary: Submit a public get-started application.
      operationId: submitMerchantIntake
      security: []
      description: |
        Public pre-account intake for merchants who want ChainMore access.
        The endpoint stores structured facts for human review and returns a
        reference code. It does not create a merchant account, dashboard user,
        API key, provider configuration, live-mode approval, checkout session,
        payment intent, or money-movement capability.

        Abuse controls sit before persistence: fixed-window rate limiting,
        a 32 KiB request-body cap, strict JSON decoding, and a honeypot field
        that returns a normal-looking 201 without inserting a row.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantIntakeRequest" }
      responses:
        '201':
          description: Application accepted or honeypot facade returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantIntakeResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '429': { $ref: "#/components/responses/RateLimited" }
        '500': { $ref: "#/components/responses/ServerMisconfigured" }

  /v1/payments:
    post:
      summary: Create a payment.
      operationId: createPayment
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        '201':
          description: Payment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePaymentResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '429': { $ref: "#/components/responses/RateLimited" }

  /v1/payments/{id}:
    get:
      summary: Read a payment.
      operationId: getPayment
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Payment view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/payments/{id}/attempts:
    post:
      summary: Start a payment attempt.
      operationId: startAttempt
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/CorrelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartAttemptRequest" }
      responses:
        '201':
          description: Attempt created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartAttemptResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/payments/{id}/attempts/{aid}/register-direct-tx:
    post:
      summary: Record the user-signed tx for a direct-wallet leg.
      operationId: registerDirectTx
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/AttemptID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDirectTxRequest" }
      responses:
        '200':
          description: Direct tx recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterDirectTxResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/checkout/sessions:
    post:
      summary: Create a hosted-checkout session.
      description: |
        Mints the one-time checkout token for a payment. A payment has exactly one
        checkout session: while a session is active (created, wallet_bound,
        route_ready, submitted, executing, card_authorizing) a second call is
        refused with 409. A cancelled, expired or failed session is reopened in
        place: the same session id continues with a fresh token, the previous
        token stops resolving, and every wallet, route and transaction binding is
        cleared. A settled session is the completed payment's record and is
        refused with 409.
      operationId: initCheckoutSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitSessionRequest" }
      responses:
        '201':
          description: Session created or reopened; raw token returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InitSessionResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/checkout/sessions/by-payment/{payment_id}:
    get:
      summary: Poll the checkout state for a payment.
      operationId: getCheckoutState
      parameters:
        - $ref: "#/components/parameters/CheckoutPaymentID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Current CKO read-model view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutState" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/checkout/sessions/by-payment/{payment_id}/bind-wallet:
    post:
      summary: Bind wallet + source chain; triggers routing + validation.
      operationId: bindCheckoutWallet
      parameters:
        - $ref: "#/components/parameters/CheckoutPaymentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindWalletRequest" }
      responses:
        '200':
          description: Session advanced to route_ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindWalletResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }

  /v1/checkout/sessions/by-payment/{payment_id}/submit:
    post:
      summary: User-signed submit; runs dispatch gate then starts execution.
      operationId: submitCheckoutExecution
      parameters:
        - $ref: "#/components/parameters/CheckoutPaymentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitExecutionRequest" }
      responses:
        '200':
          description: Session advanced to submitted/executing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitExecutionResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }

  /v1/checkout/sessions/by-payment/{payment_id}/cancel:
    post:
      summary: Cancel a non-terminal session.
      operationId: cancelCheckoutSession
      parameters:
        - $ref: "#/components/parameters/CheckoutPaymentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '204':
          description: Session cancelled (terminal).
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/checkout/sessions/by-token/{token}:
    get:
      summary: Look up a checkout session by its token.
      operationId: getCheckoutSessionByToken
      security: []
      description: |
        Used by the hosted checkout page. It needs no `Authorization`
        header and no merchant API key. The checkout token in the path is
        the credential, so anyone who holds the token can read the
        session. The gateway hashes the token and looks up the session by
        the hash. An unknown token returns 404.
      parameters:
        - $ref: "#/components/parameters/CheckoutToken"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Session record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/merchants:
    get:
      summary: Reserved merchant endpoint.
      operationId: merchantsPlaceholder
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Reserved shape; stable until the merchants surface becomes available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantsReservedResponse" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/routing/plan:
    post:
      summary: Plan a payment route.
      operationId: planRoute
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRouteRequest" }
      responses:
        '200':
          description: Authoritative routing decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingDecision" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/routing/decisions/{id}:
    get:
      summary: Fetch a routing decision by ID.
      operationId: getRoutingDecision
      parameters:
        - $ref: "#/components/parameters/DecisionID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Decision found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingDecision" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/validation/validate:
    post:
      summary: Validate a proposed payment route.
      operationId: validateRoute
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateRouteRequest" }
      responses:
        '200':
          description: Validation complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteValidation" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/validation/validations/{id}:
    get:
      summary: Fetch a route validation by ID.
      operationId: getRouteValidation
      parameters:
        - $ref: "#/components/parameters/DecisionID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Validation found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteValidation" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dispatch/decide:
    post:
      summary: Check whether a payment route can proceed.
      operationId: decideDispatch
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchDecideRequest" }
      responses:
        '200':
          description: Dispatch decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchDecision" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/dispatch/decisions/{id}:
    get:
      summary: Fetch a dispatch decision by ID.
      operationId: getDispatchDecision
      parameters:
        - $ref: "#/components/parameters/DecisionID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Decision found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchDecision" }
        '404': { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------------------
  # Widget / Hosted Checkout JSON surface (WGT-I1)
  # -------------------------------------------------------------------------
  /v1/checkout/widget/bind-wallet:
    post:
      summary: Bind the end-user wallet using the checkout token.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. The browser never sends or sees a merchant API key or
        payment_id; the server resolves the payment binding from the token.
      operationId: bindWidgetWallet
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindWalletRequest" }
      responses:
        '200':
          description: Session advanced to route_ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindWalletResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }

  /v1/checkout/widget/session:
    get:
      summary: Redacted widget view for the hosted checkout browser page.
      description: |
        Authenticated with the short-lived checkout token (not the merchant
        key): `Authorization: Bearer <raw-checkout-token>`, or as a
        `?token=` query fallback for curl. Returns the redacted view
        the widget renders from (WGT-I1).
      operationId: getWidgetSession
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Widget view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetSessionView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/checkout/links:
    post:
      summary: Create a checkout link.
      description: |
        Prices an offer once (amount, currency, order). The hosted checkout
        shows the customer the rails the link can bind to (Card for EUR,
        USDT and USDC for USD, subject to the merchant's settlement
        configuration); the customer's choice creates the payment on that
        rail and binds the link to it exactly once. No payment row exists
        until the customer chooses. The `checkout_token` (cl_ prefix) is
        returned once; the checkout URL is `<checkout origin>/checkout/?token=<checkout_token>`.
        Stablecoin rails settle a USD-priced amount at par in six-decimal
        base units; there is no foreign exchange.
      operationId: createCheckoutLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutLinkCreateRequest" }
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLink" }
        '200':
          description: Replayed under the same Idempotency-Key with identical facts (the token is not echoed again).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLink" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/checkout/links/{id}:
    get:
      summary: Read a checkout link and, once bound, the payment or intent it points to.
      operationId: getCheckoutLink
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLink" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }


  /v1/checkout/widget/stablecoin/quote:
    post:
      summary: Observe native stablecoin routes for an existing API payment.
      description: |
        Requires the short-lived checkout session token, not a merchant API
        key. The token selects the payment and its merchant, mode, amount,
        asset, target and expiry. These cannot be overridden in the request.
        Available only when the shared stablecoin decision service is wired
        (currently with checkout-link wiring); this contract does not assert
        deployment or hosted-page integration. Test/live scope must match.
        Expired, terminal, card-owned or already executing sessions refuse.
        Payments with a checkout-link-bound selection refuse with 409;
        use the original link to resume its accepted route.
        Read-only: creates no payment, attempt, signature or reservation.
        An incomplete comparison includes findings; no balance is guessed.
      operationId: quoteWidgetStablecoinPayment
      security:
        - checkoutSessionToken: []
        - checkoutSessionTokenQuery: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StablecoinDecisionWallet"
      responses:
        '200':
          description: Observed proposal; Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StablecoinDecisionProposal"
        '400':
          description: Invalid input or expired session.
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409':
          description: Session or payment state refuses, or terms changed.
        '429':
          description: Discovery busy; Retry-After 1 second.
        '500':
          description: Decision not wired or internal failure; no internal detail.
        '503':
          description: Observations unavailable; retry without assuming a route.

  /v1/checkout/widget/stablecoin/select:
    post:
      summary: Retain the displayed native route terms on the existing API payment.
      description: |
        Requires the short-lived checkout session token, not a merchant API
        key. The token selects the payment and its merchant, mode, amount,
        asset, target and expiry. These cannot be overridden in the request.
        Available only when the shared stablecoin decision service is wired
        (currently with checkout-link wiring); this contract does not assert
        deployment or hosted-page integration. Test/live scope must match.
        Expired, terminal, card-owned or already executing sessions refuse.
        Payments with a checkout-link-bound selection refuse with 409;
        the session token cannot replace the link's accepted route.
        Re-quotes and rejects changed terms. Does not start execution or sign.
        After success use the existing widget/usdt0/prepare wallet flow.
      operationId: selectWidgetStablecoinPayment
      security:
        - checkoutSessionToken: []
        - checkoutSessionTokenQuery: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [wallet, stablecoin]
              properties:
                wallet: { $ref: "#/components/schemas/StablecoinDecisionWallet" }
                stablecoin: { $ref: "#/components/schemas/StablecoinDecisionQuote" }
      responses:
        '200':
          description: Terms retained; Cache-Control no-store. No execution started.
          content:
            application/json:
              schema:
                type: object
                required: [selected]
                properties:
                  selected: { type: boolean, enum: [true] }
        '400':
          description: Invalid input or expired session.
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409':
          description: Session or payment state refuses, or terms changed.
        '429':
          description: Discovery busy; Retry-After 1 second.
        '500':
          description: Decision not wired or internal failure; no internal detail.
        '503':
          description: Observations unavailable; retry without assuming a route.

  /v1/checkout/widget/link:
    get:
      summary: Redacted checkout-link view for the hosted checkout browser page.
      description: |
        Authenticated with the link token (`Authorization: Bearer cl_…` or
        `?token=`). Lists `available_payment_methods`; once bound it carries
        the concrete `checkout_token` the page continues on.
      operationId: getWidgetCheckoutLink
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Link view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLinkView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
    post:
      summary: Observe the stablecoin routes a connected wallet can pay this open link with.
      description: |
        Authenticated with the link token. Only the wallet identity and the
        page's capabilities cross this boundary; merchant, amount, target and
        routes come from the link. Read-only: creates no payment, attempt,
        signature or reservation. A page that shows a forward route's Circle
        fee maximum declares `forward_circle_fee_max_v1`; only then do
        `cctp_forward` choices carry `circle_fee_max_atomic` and
        `gross_max_atomic`. Other capability names change nothing.
      operationId: quoteWidgetCheckoutLink
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, chain_id]
              properties:
                address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                chain_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
                capabilities:
                  type: array
                  maxItems: 8
                  items: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Observed proposal; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StablecoinCheckoutLinkProposal" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '429':
          description: Discovery busy; Retry-After 1 second.

  /v1/checkout/widget/link/select:
    post:
      summary: Bind the customer's payment-method choice; creates the payment on that rail.
      operationId: selectWidgetCheckoutLinkMethod
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method:
                  type: string
                  enum: [card, usdt0, usdc, stablecoin]
                  description: |
                    `stablecoin` binds the displayed terms of a discovery
                    choice: `wallet` and `stablecoin` are then required.
                wallet: { $ref: "#/components/schemas/StablecoinDecisionWallet" }
                stablecoin: { $ref: "#/components/schemas/StablecoinDecisionQuote" }
                accepted_circle_fee_max_atomic:
                  type: string
                  pattern: '^[0-9]+$'
                  description: |
                    The `circle_fee_max_atomic` of the `cctp_forward` choice,
                    sent by a page that showed it before the customer
                    confirmed. Returning the choice alone is no acceptance;
                    without this field the Circle fee binds exactly.
      responses:
        '200':
          description: Bound; continue on `checkout_token`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLinkSelection" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }

  /v1/checkout/widget/submit:
    post:
      summary: Submit the user-signed transaction using the checkout token.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. The server resolves the payment binding from the token
        and runs the same dispatch/execution path as the machine endpoint.
      operationId: submitWidgetExecution
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitExecutionRequest" }
      responses:
        '200':
          description: Session advanced to submitted/executing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitExecutionResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }

  /v1/checkout/widget/usdt0/prepare:
    post:
      summary: Bind the customer's wallet to a payment_method=usdt0 payment and receive the next unsigned call.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. For a payment created with `payment_method=usdt0`
        (test or live mode, canonical USDT, six-decimal base units) on a gateway
        that mounted the USDT0 corridor runtime, the server reads a
        hash-bound quote and allowance for the given payer wallet on
        Ethereum, checks deployment policy, token state and the simulated
        source call, records the Core quote/preflight validations, stages
        the Core attempt, leg and provider binding for exactly one plan step
        (approval reset, exact approval or OFT send) and reserves that effect
        for external signing. The response carries the exact unsigned
        transaction the wallet must sign. The server derives amount, route
        and recipient; the request never asserts them. `wallet_chain_id`
        names the chain the wallet is on (728126428 for a TRON wallet); the
        same-chain rail routes by it (ADR-0076): it pays on the first chain
        of the wallet's address family where the wallet holds the amount and
        the merchant has an account, the target the merchant declared for
        that chain, or on the stored chain the account the payment was bound
        to. A wallet on a family the merchant declared no target for
        answers 400 `wallet_chain_not_accepted` with the accepted networks in
        the detail. The USDT0 corridor (Ethereum to Arbitrum) is the fallback
        for an Arbitrum account only. Idempotent for the
        same wallet: a reserved, unexpired step replays; a step whose local
        deadline passed without a bound transaction is retired and a new
        attempt is planned. Another wallet, a non-usdt0 payment, a session
        owned by the card rail or a merchant without a configured recipient
        answers 409.
      operationId: prepareWidgetUSDT0Step
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetUSDT0PrepareRequest" }
      responses:
        '200':
          description: Next USDT0 step prepared (or replayed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetUSDT0Response" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  /v1/checkout/widget/usdt0/source-tx:
    post:
      summary: Bind the wallet's broadcast transaction hash to the prepared USDT0 step.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. Binds the transaction hash the wallet reported for
        the given leg to that leg's reserved provider effect exactly once
        (a different hash for the same leg is a conflict, the same hash
        replays) and then observes what is available now: inclusion of the
        source transaction, the Ethereum finalized checkpoint for approvals,
        the successor step, source ownership of the OFT send or destination
        delivery. Nothing is credited from the request: every observation is
        verified against the retained quote and the signed transaction.
      operationId: registerWidgetUSDT0SourceTransaction
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetUSDT0SourceTxRequest" }
      responses:
        '200':
          description: Hash bound; current progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetUSDT0Response" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  /v1/checkout/widget/usdt0/tron-tx:
    post:
      summary: Build the unsigned TRON transaction of the prepared USDT step for the wallet to sign.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token (ADR-0070). For a reserved leg on TRON, Core has the
        node build the exact TriggerSmartContract envelope from the retained
        calldata (byte for byte, with the configured fee limit). TRON
        envelopes expire about a minute after they are built, so the page
        asks at signing time. Nothing is bound by this call.
      operationId: buildWidgetUSDT0TronTransaction
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetUSDT0TronTxRequest" }
      responses:
        '200':
          description: The unsigned envelope and its expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetUSDT0TronTxResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  /v1/checkout/widget/usdt0/tron-broadcast:
    post:
      summary: Broadcast the wallet-signed TRON transaction and bind its id to the prepared step.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token (ADR-0070). Core checks the signed envelope is the
        retained plan (owner, target, calldata), broadcasts it through its
        own node access and binds the transaction id to the leg exactly
        once, then observes what is available now. The page never talks to
        a TRON node and carries no provider secret.
      operationId: broadcastWidgetUSDT0Tron
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetUSDT0TronBroadcastRequest" }
      responses:
        '200':
          description: Transaction broadcast and bound; current progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetUSDT0Response" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  /v1/checkout/widget/usdt0/advance:
    post:
      summary: Observe the chain for the session's USDT0 payment and report progress.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. Performs the bounded chain observations the current
        phase needs (source receipt, finalized checkpoint, successor
        planning, destination OFTReceived lookup by GUID) and mirrors the
        resulting progress into the session. Polled by the hosted checkout
        while a step is in flight; `GET /v1/checkout/widget/session` reports
        the same progress from retained evidence without chain reads.
      operationId: advanceWidgetUSDT0
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Current progress after observation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetUSDT0Response" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  /v1/checkout/widget/card/prepare:
    post:
      summary: Admit the card method for the session through the canonical pipeline.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. For an admitted fiat card payment (created with
        `payment_method=card`: the customer card is charged in the requested
        currency and the merchant settles in that same currency) the server
        runs route selection (a registered PSP provider candidate), pre-flight
        validation, the dispatcher gate and `StartAttempt` with the
        `psp_payment_handle` authorization mode, materialising the canonical
        attempt and psp_charge leg with NO provider effect, and makes the
        card rail the owner of the session (`card_authorizing`). The response
        carries the exact fiat facts and the provider reference the browser
        must hand to the provider payment handle. Idempotent: a session the
        card rail already owns replays its preparation. A wallet-owned
        session, a non-card payment or a pipeline refusal answers 409.
      operationId: prepareWidgetCardExecution
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Card execution prepared (or replayed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetCardPrepareResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '410': { $ref: "#/components/responses/Gone" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  /v1/checkout/widget/card/submit:
    post:
      summary: Submit one Paysafe payment handle token for the session's prepared card charge.
      description: |
        Public browser endpoint authenticated only with the short-lived
        checkout token. The server resolves the checkout session, the stored
        fiat card payment and the attempt/leg admitted by
        `/v1/checkout/widget/card/prepare` from the token, seals the durable
        provider binding of that leg with the digest of the single-use
        payment handle token (or replays an identical seal), and executes
        the charge exactly once under the provider-outcome compare-and-swap:
        concurrent or repeated submits never reach the provider twice. The
        outcome advances the leg, the attempt, the payment and the session
        consistently. The body carries only the payment handle token; any
        other field is rejected. Merchant, payment, provider, amount,
        currency, provider reference, attempt/leg identity, policy version
        and environment are server-side facts and can never be supplied or
        overridden by the browser. Sandbox test-mode only; the route answers
        501 when the card path is not configured.

        A session without a prepared card attempt, a session owned by the
        wallet rail, a terminal session or a payment outside the fiat card
        corridor answers 409. The gateway-wide `Idempotency-Key` header is
        required on this POST like on every other mutation, but it carries
        no money-path authority: the sealed binding and the durable session
        ownership decide replay and conflict, never the browser-supplied key.
      operationId: submitWidgetCardCharge
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: token
          in: query
          required: false
          description: "Raw checkout token fallback when Authorization header is not used."
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetCardSubmitRequest" }
      responses:
        '200':
          description: |
            Durable product truth of the card charge. `unknown` is also a 200:
            the provider was called but the outcome is not yet known, and the
            browser must not retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetCardSubmitResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '501': { $ref: "#/components/responses/NotImplemented" }

  # -------------------------------------------------------------------------
  # Merchant Dashboard async export control plane
  # -------------------------------------------------------------------------
  /v1/dashboard/mode-selection:
    get:
      summary: Read the server-resolved dashboard test/live mode state.
      operationId: getDashboardModeSelection
      security:
        - dashboardSession: []
      description: |
        Returns the effective dashboard mode for the authenticated OIDC
        merchant-user session. The mode is derived from server-owned
        membership, live-access policy, and persisted D3 selection state;
        arbitrary query parameters, browser-local flags, and caller-supplied
        mode headers are not mode authority.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Current dashboard mode state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardModeSelectionResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

    post:
      summary: Persist a server-authoritative dashboard test/live mode selection.
      operationId: setDashboardModeSelection
      security:
        - dashboardSession: []
      description: |
        Requests a dashboard mode switch for the authenticated OIDC
        merchant-user session. The server verifies membership and live-access
        policy before persisting the selection. Selecting live is refused until
        the merchant's live-mode gate is approved; selecting test never enables
        live money movement, live webhooks, live provider credentials, or host
        environment changes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardModeSelectionRequest" }
      responses:
        '200':
          description: Persisted dashboard mode state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardModeSelectionResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

  /v1/dashboard/exports:
    get:
      summary: List recent async dashboard export jobs.
      operationId: listDashboardExportJobs
      security:
        - dashboardSession: []
      description: |
        Lists recent async export job metadata for the authenticated
        merchant and mode. Cross-merchant and cross-mode jobs are not
        visible, and storage/provider internals are never exposed.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Recent export jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardExportJobsPage" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

    post:
      summary: Queue an async dashboard export job for the authenticated merchant.
      operationId: createDashboardExportJob
      security:
        - dashboardSession: []
      description: |
        Creates export job metadata only. Merchant and mode are resolved
        from the dashboard auth context; request bodies cannot assert
        merchant_id or mode. This endpoint does not run a worker, create
        a downloadable file, expose storage URIs, or move funds.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardExportJobCreateRequest" }
      responses:
        '202':
          description: Export job accepted or existing matching idempotent job returned.
          headers:
            Location:
              description: Status URL for the queued export job.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardExportJobView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/exports/{id}:
    get:
      summary: Read async dashboard export job status.
      operationId: getDashboardExportJob
      security:
        - dashboardSession: []
      description: |
        Reads export job metadata for the authenticated merchant and
        mode. Cross-merchant or cross-mode job IDs do not return another
        merchant's job; storage_uri and raw failure_message are never
        exposed.
      parameters:
        - $ref: "#/components/parameters/DashboardExportID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Export job status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardExportJobView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dashboard/exports/{id}/download:
    get:
      summary: Download a completed async dashboard export.
      operationId: downloadDashboardExportJob
      security:
        - dashboardSession: []
      description: |
        Streams the generated export artifact for the authenticated
        merchant and mode. Cross-merchant, cross-mode, missing, queued,
        running, failed, or cancelled jobs do not expose another export.
        The response never returns storage_uri, object keys, signed URLs,
        or storage-provider credentials.
      parameters:
        - $ref: "#/components/parameters/DashboardExportID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Export artifact stream.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Content-Disposition:
              description: Deterministic attachment filename.
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/x-ndjson:
              schema: { type: string, format: binary }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }
        '500': { $ref: "#/components/responses/ServerMisconfigured" }

  # -------------------------------------------------------------------------
  # Merchant onboarding control plane
  # -------------------------------------------------------------------------
  /v1/onboarding/acceptance:
    get:
      summary: Read the first-login acknowledgement state of the signed-in merchant user.
      operationId: getMerchantFirstLoginAcceptance
      security:
        - dashboardSession: []
      description: |
        Merchant-user control-plane read. The server resolves merchant, member,
        issuer, subject and role from the authenticated dashboard user; API keys
        are refused. When the merchant was created at or after the configured
        cutoff, the response carries the exact document manifest the user has
        to confirm before any other dashboard request is admitted.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Current acknowledgement state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantAcceptanceStatus" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '503':
          description: The acknowledgement state cannot be read; the dashboard stays closed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

    post:
      summary: Record the first-login acknowledgements of the signed-in merchant user.
      operationId: recordMerchantFirstLoginAcceptance
      security:
        - dashboardSession: []
      description: |
        Merchant-user control-plane write. Records the personal
        acknowledgement and, for an owner or admin who confirms the company
        terms as authorised representative, the company acceptance. Both are
        bound to the presented manifest version and hash and are append-only;
        a repeat returns the rows recorded first.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantAcceptanceRequest" }
      responses:
        '200':
          description: Acknowledgements recorded; current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantAcceptanceStatus" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '409': { $ref: "#/components/responses/Conflict" }
        '503':
          description: The acknowledgement could not be recorded or confirmed; retry reads the same rows.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/onboarding/account-profile:
    get:
      summary: Read the authenticated merchant's current business profile submission.
      operationId: getAccountProfileSubmission
      security:
        - dashboardSession: []
      description: |
        Merchant-user readback for the current submitted business profile.
        The server resolves merchant_id from the authenticated dashboard user.
        This endpoint is read-only: it does not grant live access, issue keys,
        create provider handles, or expose DD/KYB decision notes.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Current account profile readback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfileReadbackResponse" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '500': { $ref: "#/components/responses/ServerMisconfigured" }

    post:
      summary: Submit the authenticated merchant's business profile for account review.
      operationId: submitAccountProfile
      security:
        - dashboardSession: []
      description: |
        Merchant-user control-plane write. The server resolves
        merchant_id from the authenticated dashboard user; callers must
        not send tenant identity in the body. This starts DD/KYB review
        only. It does not grant live access, issue API keys, create
        provider handles, or trigger payments.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAccountProfileRequest" }
      responses:
        '201':
          description: Account profile submission accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitAccountProfileResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '500': { $ref: "#/components/responses/ServerMisconfigured" }

  /v1/onboarding/display-name:
    patch:
      summary: Update the authenticated merchant's optional display name.
      operationId: updateMerchantDisplayName
      security:
        - dashboardSession: []
      description: |
        Merchant-user control-plane write for the merchant-maintained
        presentation label used by dashboard and checkout surfaces. The server
        resolves merchant_id from the authenticated dashboard user; callers must
        not send tenant identity in the body. This does not change legal
        identity, live access, API keys, provider handles, or payments.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMerchantDisplayNameRequest" }
      responses:
        '200':
          description: Merchant display name updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateMerchantDisplayNameResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '500': { $ref: "#/components/responses/ServerMisconfigured" }

  # -------------------------------------------------------------------------
  # Merchant Dashboard read plane (MDA-I2 - GET-only; exports above are
  # separate control-plane metadata endpoints)
  # -------------------------------------------------------------------------
  /v1/dashboard/integration:
    get:
      summary: Merchant-scoped integration posture summary.
      operationId: getDashboardIntegration
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Integration view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantIntegrationView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dashboard/onboarding/progress:
    get:
      summary: Read merchant onboarding setup progress.
      operationId: getDashboardOnboardingProgress
      security:
        - dashboardSession: []
      description: |
        Read-only setup-progress contract for the authenticated
        merchant. The response is derived from existing account,
        API-key, webhook, test-event, and settled test-payment rows.
        It does not issue keys, fire webhooks, trigger payments,
        create provider handles, or enable live access.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Onboarding setup progress view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOnboardingProgressView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dashboard/audit-events:
    get:
      summary: List account audit events for the authenticated merchant.
      operationId: listDashboardAuditEvents
      security:
        - dashboardSession: []
      description: |
        Read-only account activity for the authenticated merchant. The
        endpoint is merchant-scoped and deliberately redacted: it returns
        event type, actor type, optional bounded target, and timestamp
        only. It never returns metadata JSON, idempotency keys, raw
        DD/KYB review reasons, operator notes, or another merchant's row.
      parameters:
        - $ref: "#/components/parameters/DashboardCursor"
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Page of account audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardAuditEventsPage" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/team-access:
    get:
      summary: Read team members and invitations for the authenticated merchant.
      operationId: getDashboardTeamAccess
      security:
        - dashboardSession: []
      description: |
        Read-only account-level team access snapshot. The endpoint is
        merchant-scoped and redacted: it returns member role/status and
        invitation role/status, but never OIDC issuer/subject,
        invitation_token_hash, plaintext invitation tokens, or
        cross-merchant rows.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Redacted team access snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardTeamAccessPage" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/notifications/preferences:
    get:
      summary: Read dashboard notification-routing preferences.
      operationId: getDashboardNotificationPreferences
      security:
        - dashboardSession: []
      description: |
        Merchant- and mode-scoped saved dashboard notification
        preferences. This endpoint returns dashboard signal-routing
        preferences only. It does not claim that email, Slack, pager,
        or provider-side delivery is configured.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Dashboard notification-routing preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardNotificationPreferencesView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Save dashboard notification-routing preferences.
      operationId: updateDashboardNotificationPreferences
      security:
        - dashboardSession: []
      description: |
        Merchant-scoped control-plane action. The caller must be an
        owner/admin dashboard user. The endpoint persists dashboard
        signal-routing preferences and writes account audit evidence,
        but it does not configure email, Slack, pager, provider-side
        delivery, or hidden operator routing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardNotificationPreferencesInput" }
      responses:
        '200':
          description: Saved dashboard notification-routing preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardNotificationPreferencesView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

  /v1/dashboard/team-access/invitations:
    post:
      summary: Create a pending team invitation for the authenticated merchant.
      operationId: createDashboardTeamInvitation
      security:
        - dashboardSession: []
      description: |
        Merchant-scoped team access control action. The caller must be
        an owner/admin dashboard user. The endpoint records a pending
        invitation and returns only the redacted invitation projection:
        no invitation_token_hash, plaintext invitation token, OIDC
        issuer, or subject is exposed. The invited person joins by
        signing in with the same verified email.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardTeamInvitationInput" }
      responses:
        '202':
          description: Pending invitation projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardTeamInvitationView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/dashboard/team-access/invitations/{id}/revoke:
    post:
      summary: Revoke a pending team invitation for the authenticated merchant.
      operationId: revokeDashboardTeamInvitation
      security:
        - dashboardSession: []
      description: |
        Merchant-scoped team access control action. The caller must be
        an owner/admin dashboard user. The endpoint only revokes pending
        invitations, never accepted membership, and never exposes
        invitation_token_hash or plaintext invitation tokens.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked invitation projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardTeamInvitationView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/dashboard/team-access/members/{id}/role:
    post:
      summary: Change an active non-owner team member's dashboard role.
      operationId: updateDashboardTeamMemberRole
      security:
        - dashboardSession: []
      description: |
        Merchant-scoped team access control action. The caller must be
        an owner/admin dashboard user. The endpoint changes only active
        non-owner members and never performs ownership transfer, self-role
        changes, or cross-merchant membership edits. The response is a
        redacted member projection and never exposes OIDC issuer/subject.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardTeamMemberRoleInput" }
      responses:
        '200':
          description: Updated team member projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardTeamMemberView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/dashboard/team-access/members/{id}/revoke:
    post:
      summary: Remove an active non-owner team member's dashboard access.
      operationId: revokeDashboardTeamMember
      security:
        - dashboardSession: []
      description: |
        Merchant-scoped team access control action. The caller must be
        an owner/admin dashboard user. The endpoint revokes active
        non-owner membership without deleting the audit row; owner
        removal and self-removal require a separate reviewed process.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked team member projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardTeamMemberView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { $ref: "#/components/responses/Conflict" }

  /v1/dashboard/settings/policy/change-requests:
    post:
      summary: Submit a settlement-policy change request for review.
      operationId: createDashboardPolicyChangeRequest
      security:
        - dashboardSession: []
      description: |
        Merchant-scoped control-plane action. The caller must be an
        owner/admin dashboard user. The request is persisted as review
        evidence and audited, but it does not mutate merchant_policies,
        routing, or live settlement behavior.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardPolicyChangeRequestInput" }
      responses:
        '202':
          description: Submitted policy change request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPolicyChangeRequestView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

  /v1/dashboard/exceptions/summary:
    get:
      summary: Read the exception depth of the authenticated merchant's Core payments (mode-scoped).
      operationId: getDashboardExceptionSummary
      security:
        - dashboardSession: []
      description: |
        Compact read-only Ops snapshot of the Core payments in the
        needs_review, failed_safely and expired buckets; delayed has no
        Core source. Merchant and mode come from the authenticated
        dashboard context.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Exception-depth summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardExceptionSummary" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/customers/{id}:
    get:
      summary: Read Customer-360 activity for one merchant-supplied customer reference.
      operationId: getDashboardCustomerActivity
      security:
        - dashboardSession: []
      description: |
        Returns a merchant- and mode-scoped activity summary plus recent
        reconciliation rows of the Core payments for one pseudonymous
        customer_reference. The path id is the merchant-supplied
        customer_reference; merchant and mode come from the
        authenticated dashboard context.
      parameters:
        - name: id
          in: path
          required: true
          description: Merchant-supplied customer_reference.
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Customer activity view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardCustomerActivityPage" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/payments:
    get:
      summary: List payments for the authenticated merchant (mode-scoped).
      operationId: listDashboardPayments
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/DashboardCursor"
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/DashboardPaymentSearch"
        - $ref: "#/components/parameters/DashboardPaymentStatus"
        - $ref: "#/components/parameters/DashboardPaymentCreatedFrom"
        - $ref: "#/components/parameters/DashboardPaymentCreatedTo"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Page of payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPaymentsPage" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/payments/export.csv:
    get:
      summary: Export the filtered dashboard payment result set as CSV.
      operationId: exportDashboardPaymentsCSV
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/DashboardPaymentSearch"
        - $ref: "#/components/parameters/DashboardPaymentStatus"
        - $ref: "#/components/parameters/DashboardPaymentCreatedFrom"
        - $ref: "#/components/parameters/DashboardPaymentCreatedTo"
        - $ref: "#/components/parameters/DashboardExportLimit"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: CSV export. Requested fiat amount/currency and settlement asset are separate columns.
          headers:
            X-ChainMore-Export-Returned-Count:
              description: Number of rows included in this CSV response.
              schema: { type: integer, minimum: 0 }
            X-ChainMore-Export-Row-Limit:
              description: Server-enforced maximum rows for this CSV response.
              schema: { type: integer, minimum: 1, maximum: 5000 }
            X-ChainMore-Export-Total-Count:
              description: Full filtered result count before the CSV row cap.
              schema: { type: integer, minimum: 0 }
            X-ChainMore-Export-Truncated:
              description: True when the filtered result set is larger than the returned CSV.
              schema: { type: boolean }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/payments/{id}:
    get:
      summary: Read a single payment from the dashboard projection.
      operationId: getDashboardPayment
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/DashboardPaymentID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Payment view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPaymentView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dashboard/checkout_sessions:
    get:
      summary: List checkout sessions for the authenticated merchant (mode-scoped).
      operationId: listDashboardSessions
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/DashboardCursor"
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Page of sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSessionsPage" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/checkout_sessions/{id}:
    get:
      summary: Read a single checkout session from the dashboard projection.
      operationId: getDashboardSession
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/DashboardSessionID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Session view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSessionView" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dashboard/reconciliation:
    get:
      summary: Search reconciliation rows for the authenticated merchant (mode-scoped).
      operationId: listDashboardReconciliation
      security:
        - dashboardSession: []
      description: |
        Read-only merchant dashboard projection over the Core payments.
        The required `q` parameter is exact-match support lookup by
        merchant_order_id, customer_reference, or payment ID.
        The repository always derives merchant and mode from auth
        context; `q` never broadens tenant or mode scope.
      parameters:
        - $ref: "#/components/parameters/DashboardLimit"
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
          description: "Required exact lookup by merchant_order_id, customer_reference, or payment-intent ID."
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Reconciliation rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardReconciliationPage" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/reconciliation/recent:
    get:
      summary: List recent reconciliation rows for the authenticated merchant.
      operationId: listRecentDashboardReconciliation
      security:
        - dashboardSession: []
      description: |
        Read-only merchant dashboard projection over the most recent Core
        payments. Merchant and mode are resolved from auth context; the
        endpoint is bounded by DashboardLimit and never exposes proofs,
        checkout token hashes, or cross-tenant rows.
      parameters:
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Recent reconciliation rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardReconciliationPage" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/reconciliation/settlement-summary:
    get:
      summary: Read aggregate settlement reconciliation for a bounded period.
      operationId: getDashboardSettlementReconciliationSummary
      security:
        - dashboardSession: []
      description: |
        Read-only high-volume Finance summary. Merchant and mode are
        resolved from auth context; the query only bounds the time
        window and optional route filters. The endpoint exposes ledger-side
        totals and returns on_chain.status = unavailable unless bounded
        settlement-event evidence is configured for the selected route.
      parameters:
        - name: created_from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of the created_at window, inclusive. YYYY-MM-DD is also accepted by the Gateway.
        - name: created_to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of the created_at window, exclusive. YYYY-MM-DD is accepted and treated as the end of that date.
        - name: dest_chain
          in: query
          schema:
            type: string
            enum: [ethereum, base, arbitrum, polygon]
          description: Optional destination chain filter.
        - name: settlement_contract
          in: query
          schema:
            type: string
            pattern: '^0x[a-f0-9]{40}$'
          description: Optional destination settlement contract filter.
        - name: merchant_wallet
          in: query
          schema:
            type: string
            pattern: '^0x[a-f0-9]{40}$'
          description: Optional merchant wallet filter.
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Aggregate settlement reconciliation summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSettlementReconciliationSummary" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/reconciliation/route-summary:
    get:
      summary: Read route-level ledger summary for a bounded period.
      operationId: getDashboardRouteLedgerSummary
      security:
        - dashboardSession: []
      description: |
        Read-only Merchant Dashboard route ledger contract. Merchant and
        mode are resolved from auth context; query parameters only bound
        the created_at window. If both created_from and created_to are
        omitted, the Gateway uses the last 24 hours. It aggregated the
        CCTP intent routes retired with R1 and carries no rows since; it
        is not a provider health, latency, success-rate, or availability
        claim.
      parameters:
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start of the created_at window, inclusive. YYYY-MM-DD is also accepted by the Gateway. Must be paired with created_to when provided.
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End of the created_at window, exclusive. YYYY-MM-DD is accepted and treated as the end of that date. Must be paired with created_from when provided.
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Route-level ledger summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardRouteLedgerSummary" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/reconciliation/route-health-summary:
    get:
      summary: Read route-level health projection for a bounded period.
      operationId: getDashboardRouteHealthSummary
      security:
        - dashboardSession: []
      description: |
        Backend-only Merchant Dashboard route-health projection. Merchant
        and mode are resolved from auth context; query parameters only
        bound the created_at window. If both created_from and created_to
        are omitted, the Gateway uses the last 24 hours. It projected the
        CCTP intent routes retired with R1 and carries no rows since.
      parameters:
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start of the created_at window, inclusive. YYYY-MM-DD is also accepted by the Gateway. Must be paired with created_to when provided.
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End of the created_at window, exclusive. YYYY-MM-DD is accepted and treated as the end of that date. Must be paired with created_from when provided.
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Route-level health projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardRouteHealthSummary" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/reconciliation/{id}:
    get:
      summary: Read one CCTP payment-intent reconciliation detail row (retired with R1).
      operationId: getDashboardReconciliation
      security:
        - dashboardSession: []
      description: |
        Read-only merchant dashboard detail for one CCTP payment intent.
        The CCTP intents are retired with R1, so every id answers not
        found. Core payments are read through the payment detail.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Bounded reconciliation lifecycle detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardReconciliationDetailView" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/dashboard/webhooks/endpoints:
    get:
      summary: List webhook endpoints for the authenticated merchant (mode-scoped).
      operationId: listDashboardWebhookEndpoints
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Webhook endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardWebhookEndpointsPage" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/webhooks/summary:
    get:
      summary: Read webhook delivery health summary for the authenticated merchant (mode-scoped).
      operationId: getDashboardWebhookHealthSummary
      security:
        - dashboardSession: []
      description: |
        Read-only merchant dashboard metric contract over
        webhook_endpoints and webhook_outbox for the last 24h. Merchant
        and mode are resolved from auth context; the response never
        exposes webhook secrets, signing material, body bytes, raw
        response text, or cross-merchant identifiers.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Bounded webhook health summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardWebhookHealthSummary" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/webhooks/deliveries:
    get:
      summary: List webhook delivery attempts for the authenticated merchant (mode-scoped).
      operationId: listDashboardWebhookDeliveries
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/DashboardCursor"
        - $ref: "#/components/parameters/DashboardLimit"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Page of deliveries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardWebhookDeliveriesPage" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  # -------------------------------------------------------------------------
  # Merchant Integration control plane (IDX-I3 - self-service lifecycle)
  #
  # These endpoints take only a dashboard login token (dashboardSession).
  # The one exception is POST /v1/webhook_endpoints/{id}/test, which also
  # takes a merchant API key. The merchant and the mode come from the
  # credential; the caller cannot set the mode (IDX-I2).
  # -------------------------------------------------------------------------
  /v1/keys:
    get:
      summary: List API keys for the authenticated merchant, in the dashboard's selected mode.
      operationId: listKeys
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Keys in the dashboard's selected mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListKeysResponse" }
        '401': { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Mint a new API key for the authenticated merchant, in the dashboard's selected mode.
      operationId: createKey
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyRequest" }
      responses:
        '201':
          description: Key created - plaintext secret returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateKeyResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/keys/{id}:
    delete:
      summary: Revoke an API key. Idempotent - revoking an already-revoked key is a no-op.
      operationId: revokeKey
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Revoked key record.
          content:
            application/json:
              schema:
                type: object
                required: [api_key]
                properties:
                  api_key: { $ref: "#/components/schemas/APIKey" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/keys/{id}/rotate:
    post:
      summary: Rotate an API key - mint a successor, revoke the predecessor, in one transaction.
      operationId: rotateKey
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '201':
          description: Successor key minted; plaintext returned once; predecessor revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotateKeyResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/settlement_destinations:
    get:
      summary: List the authenticated merchant's payout targets in the key's mode.
      operationId: listSettlementDestinations
      description: |
        One row per corridor (token on chain), ordered by priority. The
        account is the merchant's own; a USDT payment created without
        `settlement_destination` delivers to the merchant's highest-priority
        active USDT target (the legacy `usdt0` row counts as USDT on
        Arbitrum). ChainMore never derives or substitutes an account.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Configured default accounts in the caller's mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSettlementDestinationsResponse" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/settlement_destinations/{corridor}:
    put:
      summary: Refused. Payout targets are changed only by an owner or admin in the dashboard.
      operationId: putSettlementDestination
      description: |
        Always 403 payout_targets_dashboard_only, before the body is read.
        Payout targets are where ChainMore pays out; only a merchant owner or
        admin changes them, signed in to the dashboard
        (`PUT /v1/dashboard/settlement_destinations/{corridor}`). An API key
        reads them with `GET /v1/settlement_destinations`. As for every PUT,
        a request without `Idempotency-Key` gets 400 idempotency_required
        first.
      parameters:
        - name: corridor
          in: path
          required: true
          schema: { type: string, pattern: "^(usdt0|(usdt|usdc):[a-z0-9-]{1,32})$" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: Refused. Payout targets are disabled only by an owner or admin in the dashboard.
      operationId: disableSettlementDestination
      description: |
        Always 403 payout_targets_dashboard_only. Use
        `DELETE /v1/dashboard/settlement_destinations/{corridor}` as an owner
        or admin. As for every DELETE, a request without `Idempotency-Key`
        gets 400 idempotency_required first.
      parameters:
        - name: corridor
          in: path
          required: true
          schema: { type: string, pattern: "^(usdt0|(usdt|usdc):[a-z0-9-]{1,32})$" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }

  /v1/dashboard/settlement_destinations:
    get:
      summary: List the merchant user's payout targets in the dashboard's resolved mode.
      operationId: listDashboardSettlementDestinations
      security:
        - dashboardSession: []
      description: |
        The dashboard door to the same payout targets as
        `/v1/settlement_destinations` (ADR-0075): OIDC merchant-user session,
        mode from the server-side dashboard mode selection. The response
        carries that mode so an empty list still names it.
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Configured payout targets in the dashboard's mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSettlementDestinationsResponse" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/dashboard/settlement_destinations/{corridor}:
    put:
      summary: Declare or replace one payout target from the dashboard, in the dashboard's resolved mode.
      operationId: putDashboardSettlementDestination
      security:
        - dashboardSession: []
      description: |
        Owner or admin only (other roles: 403 dashboard_role_forbidden). An
        idempotent upsert (ADR-0075); every change writes one
        `payout_target.created` or `payout_target.updated` audit event with
        the state before and after. The corridor names the token and chain
        the merchant receives on: `usdt0` (legacy alias, USDT on Arbitrum) or
        `<token>:<chain>`, e.g. `usdt:tron`, `usdt:ethereum`, `usdc:base`.
        The account must be the merchant's own on that chain: for EVM chains
        `eip155:<chain>:0x…` or a bare `0x` address, a mixed-case address
        with a valid EIP-55 checksum (an all-lowercase one is checked for
        shape only), stored lowercase; for TRON the `T…` address, stored as
        `tron:0x2b6653dc:T…`. An account of another chain is refused. A
        re-put reactivates a disabled target. Payments already created keep
        the account they were created with.
      parameters:
        - name: corridor
          in: path
          required: true
          schema: { type: string, pattern: "^(usdt0|(usdt|usdc):[a-z0-9-]{1,32})$" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutSettlementDestinationRequest" }
      responses:
        '200':
          description: The stored payout target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementDestination" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: Disable one payout target from the dashboard, in the dashboard's resolved mode.
      operationId: disableDashboardSettlementDestination
      security:
        - dashboardSession: []
      description: |
        Owner or admin only (other roles: 403 dashboard_role_forbidden). Sets
        the target to `disabled` and writes one `payout_target.disabled`
        audit event; the target stays listed and a later PUT reactivates it.
        Payments created while it was active keep it.
      parameters:
        - name: corridor
          in: path
          required: true
          schema: { type: string, pattern: "^(usdt0|(usdt|usdc):[a-z0-9-]{1,32})$" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: The disabled payout target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementDestination" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
  /v1/webhook_endpoints:
    get:
      summary: List webhook endpoints for the authenticated merchant, in the dashboard's selected mode.
      operationId: listWebhookEndpoints
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Webhook endpoints in the dashboard's selected mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEndpointsResponse" }
        '401': { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Register a new webhook endpoint, in the dashboard's selected mode.
      operationId: createWebhookEndpoint
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEndpointRequest" }
      responses:
        '201':
          description: Endpoint created; `whsec_*` signing secret returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateEndpointResponse" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }

  /v1/webhook_endpoints/{id}:
    patch:
      summary: Update a webhook endpoint (url / events / enabled). Mode is not patchable.
      operationId: updateWebhookEndpoint
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEndpointRequest" }
      responses:
        '200':
          description: Updated endpoint record.
          content:
            application/json:
              schema:
                type: object
                required: [webhook_endpoint]
                properties:
                  webhook_endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Disable a webhook endpoint. Idempotent.
      operationId: disableWebhookEndpoint
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Disabled endpoint record.
          content:
            application/json:
              schema:
                type: object
                required: [webhook_endpoint]
                properties:
                  webhook_endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/webhook_endpoints/{id}/test:
    post:
      summary: Send a synthetic settlement test event to the endpoint.
      description: |
        IDX-R2b: exercises the real webhook delivery code path without
        real money movement. The resulting outbox row carries
        `is_test_event = TRUE` and `payment_id IS NULL`.

        If the endpoint subscribes to `payment.settled` (or has an empty
        wildcard event list), the stored body is the `payment.settled`
        body with synthetic `payment_id` / `merchant_order_id` /
        `event_id` values on the `pmt_test_*` / `ord_test_*` /
        `whevt_test_*` shapes and `test_event: true`.

        Endpoints whose event list does not contain `payment.settled` are
        rejected with `invalid_request`; the test endpoint never sends an
        event type outside the endpoint subscription.

        This is the one endpoint that accepts both credentials: a
        merchant API key (for example from a CI job) or a dashboard
        login token. The outbox row's `mode` comes from that credential,
        either the key's mode or the mode selected in the dashboard. A
        request in live mode cannot test a test-mode endpoint, and the
        reverse.
      operationId: sendTestWebhookEvent
      security:
        - bearerAuth: []
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '202':
          description: Test event enqueued for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [event_id, outbox_id, endpoint_url, mode, created_at, is_test_event]
                properties:
                  event_id:
                    type: string
                    description: Synthetic event ID on the `whevt_test_*` shape.
                  outbox_id:
                    type: string
                    format: uuid
                    description: Primary key of the `webhook_outbox` row just written.
                  endpoint_url:
                    type: string
                    format: uri
                  mode:
                    type: string
                    enum: [test, live]
                  created_at:
                    type: string
                    format: date-time
                  is_test_event:
                    type: boolean
                    description: Always `true` for this endpoint's response.
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/webhook_endpoints/{id}/rotate-secret:
    post:
      summary: Rotate the HMAC signing secret for a webhook endpoint. Same endpoint id, fresh secret.
      description: |
        IDX-R3: self-service secret rotation. Mints a new `whsec_*`
        signing secret, envelope-encrypts it, and atomically replaces
        `(secret_hash, secret_ciphertext, secret_kid, updated_at)` on
        the endpoint row. The endpoint's id, url, events, enabled, and
        mode are intentionally unchanged - same endpoint, new key.

        The plaintext is returned exactly once in the response body. At
        rest the row carries only the envelope ciphertext and the
        one-way hash; a lost plaintext means the merchant must call
        this endpoint again.

        Cutover semantics - any payload already signed with the OLD
        secret that arrives after the rotate commits will fail HMAC
        verification on the merchant side. Operate rotate around a
        verifier-update window; the suggested sequence is (1) call
        rotate-secret, (2) deploy the returned plaintext to the
        verifier, (3) observe that new deliveries verify, (4) accept
        the old secret is dead.

        Mode-scoped: a request in live mode cannot rotate a test-mode
        endpoint's secret, and the reverse. Such a request returns 404.
      operationId: rotateWebhookEndpointSecret
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '200':
          description: Secret rotated; plaintext returned once; endpoint id unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [webhook_endpoint, secret]
                properties:
                  webhook_endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
                  secret:
                    type: string
                    description: |
                      New `whsec_*` signing secret. Returned exactly
                      once; never re-derivable thereafter.
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

  /v1/webhook_endpoints/{id}/deliveries/{did}/replay:
    post:
      summary: Replay a previously-emitted webhook delivery. Fresh event_id, fresh signature.
      description: |
        IDX-R2a: self-service replay of a historical webhook delivery.
        Writes a new `webhook_outbox` row that targets the same endpoint
        and carries the same semantic event, but is:

          - Signed with the CURRENT endpoint signing secret (not the
            historical secret stored on the original row).
          - Signed with a fresh `sig_timestamp` (now, RFC3339 UTC).
          - Stamped with a fresh `event_id` (the UNIQUE idempotency key).

        This signing contract is deliberate: if the merchant rotated the
        endpoint's signing secret via the rotate-secret endpoint between
        the original emit and this replay, the merchant's verifier no
        longer accepts signatures from the old secret. Re-signing with
        the current secret is the only shape that can verify at the
        merchant.

        The merchant correlates a replay back to the original delivery
        via the `replayed_from_event_id` field on the body. That field
        names the ORIGINAL `event_id` (the whevt-prefixed id the merchant
        already saw, or would have seen if the original delivered). The
        new delivery's own `event_id` is the FRESH replay id - merchants
        dedupe on event_id on their receiving side; a replay is a
        distinct delivery that happens to reference an earlier one.

        Refusals:
          - `replay_of_test_event_forbidden` (400): the delivery id
            references a test event (is_test_event=TRUE). Test events
            have their own replay path - call `POST /v1/webhook_endpoints/
            {id}/test` again.
          - `delivery_endpoint_mismatch` (400): the delivery id exists
            (merchant- and mode-scoped) but was emitted against a
            different endpoint id than the one in the path.
          - `endpoint_disabled` (400): the endpoint is currently disabled.
          - `endpoint_secret_missing_envelope` (400): the endpoint
            predates envelope-encrypted secrets (pre-MDB rollout).
            Resolve via rotate-secret, which populates envelope columns.

        Mode-scoped: a request in live mode cannot replay a test-mode
        delivery, and the reverse. Such a request returns 404 and does
        not reveal which mode the row belongs to.

        Delivery itself is asynchronous - the response 202 confirms a
        new outbox row was written; the merchant observes completion at
        their HTTP endpoint (or via the delivery-history dashboard).
      operationId: replayWebhookDelivery
      security:
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: did
          in: path
          required: true
          description: |
            The `delivery_id` (webhook_outbox.id) the merchant observed
            in the dashboard's delivery history. Server-side scoped by
            (merchant_id, mode, endpoint_id).
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        '202':
          description: Replay row accepted; delivery is asynchronous via the outbox worker.
          content:
            application/json:
              schema:
                type: object
                required:
                  - event_id
                  - replayed_from_event_id
                  - outbox_id
                  - original_outbox_id
                  - endpoint_url
                  - mode
                  - created_at
                properties:
                  event_id:
                    type: string
                    description: The fresh event id for this replay delivery.
                  replayed_from_event_id:
                    type: string
                    description: The original delivery's event id. Merchants correlate on this field.
                  outbox_id:
                    type: string
                    format: uuid
                    description: The new webhook_outbox row id.
                  original_outbox_id:
                    type: string
                    format: uuid
                    description: The replayed webhook_outbox row id (same as path `did`).
                  endpoint_url:
                    type: string
                    format: uri
                  mode:
                    type: string
                    enum: [test, live]
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: |
            Replay refused (test-event, endpoint mismatch, endpoint
            disabled, or missing envelope secret). Body is a Problem
            with one of the codes above.
        '401': { $ref: "#/components/responses/Unauthorized" }
        '404': { $ref: "#/components/responses/NotFound" }

# ---------------------------------------------------------------------------
# Webhooks (informational; body shape for merchant-side verifiers)
# ---------------------------------------------------------------------------
webhooks:
  payment.settled:
    post:
      summary: Sent when a payment reaches its settled terminal state.
      description: |
        Signed with HMAC-SHA256 using the endpoint's `whsec_*` secret
        over the `X-ChainMore-Timestamp` header value, a dot, and the
        exact raw body bytes. The lowercase hex signature is carried in
        the `X-ChainMore-Signature` header. Consumers MUST use a
        timing-safe comparison and reject stale timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        '2XX':
          description: Delivery acknowledged.
  payment.failed:
    post:
      summary: Reserved. ChainMore does not send this event today.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        '2XX':
          description: Delivery acknowledged.
  payment.expired:
    post:
      summary: Sent when a stablecoin wallet payment expires unpaid.
      description: |
        `state` is `expired`; `failure_code` names the reason. Sent only
        to endpoints that list `payment.expired` by name. Status: not yet
        enabled on the production gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        '2XX':
          description: Delivery acknowledged.
  payment.late_payment_received:
    post:
      summary: Sent when a further on-chain transfer is found for a payment that is already booked.
      description: |
        For example, the customer's authorization was executed twice.
        One event per further transfer; `state` is
        `late_payment_received`. `amount` is the amount the payment
        requested; `transfer` names the further transfer (chain,
        transaction, log) and what it moved to the merchant, in the
        token's units on that chain. Sent only to endpoints that list
        `payment.late_payment_received` by name. Status: not yet enabled
        on the production gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        '2XX':
          description: Delivery acknowledged.
  payment.delivery_delayed:
    post:
      summary: Sent when the delivery of a cross-chain stablecoin payment failed and is held for clarification.
      description: |
        The payment was received on the source chain, but the cross-chain
        message that delivers it to the merchant's account failed or is
        blocked on the destination chain. The destination chain and the
        message provider's status both say so. `state` is
        `delivery_delayed`. The payment is not ended and nothing is sent
        again: if the delivery still arrives, `payment.settled` follows.
        At most one such event per payment. Sent only to endpoints that
        list `payment.delivery_delayed` by name. Status: not yet enabled
        on the production gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        '2XX':
          description: Delivery acknowledged.