# Netlify build + functions config for chainmore.io marketing site.
#
# This file is required because the marketing site introduced its first
# server-side surface (the Concierge widget API endpoint). Until now the
# site shipped as pure static + _headers + _redirects; the Concierge
# Edge Function lives in netlify/edge-functions/ and is wired into the
# /api/concierge path below.
#
# Scope discipline:
#   - publish points at the root (this file lives next to index.html).
#   - edge_functions points at netlify/edge-functions for Deno-runtime
#     Edge Functions (Concierge lives here for streaming + low TTFB).
#   - No regular Node Functions are declared because we don't have any.
#     Pointing [build].functions at a non-existing directory makes the
#     bundler warn loudly and, depending on Netlify build version,
#     fail the deploy. When we add Node Functions later, set both
#     [build].functions and [functions] back.
#
# Local dev (optional): `netlify dev` will pick this up.

[build]
  publish    = "."

# ──────────────────────────────────────────────────────────────────────
# Edge Functions
# ──────────────────────────────────────────────────────────────────────
# /api/concierge → Concierge chat API.
#
# Why Edge (and not a regular Netlify Function):
#   - Deno runtime gives us ReadableStream + fetch SSE forwarding
#     without the AWS-Lambda buffering issue. We can stream the OpenAI
#     Responses-API output directly to the browser without buffering
#     the full reply server-side. Lower TTFB, better perceived UX.
#   - Edge runs close to the user (CDN PoP), which matters for a
#     conversational latency budget where every 100 ms is felt.
#
# The path is bound to /api/concierge — same-origin under chainmore.io,
# which means the strict `connect-src 'self'` CSP does not need to
# loosen for this endpoint.

[[edge_functions]]
  path     = "/api/concierge"
  function = "concierge"

# Health probe — separate endpoint that does NOT call OpenAI; used by
# CI smoke tests and the operator runbook to confirm the function is
# deployed and the secrets are wired. Returns {"ok":true,"version":N}.
[[edge_functions]]
  path     = "/api/concierge/health"
  function = "concierge-health"
