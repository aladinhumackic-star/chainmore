<?xml version="1.0" encoding="UTF-8"?>
<!-- ChainMore Open Graph card. 1200×630 px.
     Hand-tuned for ImageMagick's basic SVG renderer: no tspans,
     no radial gradients, no patterns. Plain rect backgrounds,
     explicit x/y on every text element, simple geometry. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b1220"/>

  <!-- Subtle slate band at the bottom for a layered feel -->
  <rect x="0" y="540" width="1200" height="90" fill="#0f172a"/>

  <!-- Cyan accent dot top-right -->
  <circle cx="1090" cy="100" r="60" fill="#00D9FF" fill-opacity="0.08"/>
  <circle cx="1090" cy="100" r="6"  fill="#00D9FF"/>

  <!-- Logo mark — single coherent group, no scale tricks -->
  <g transform="translate(70,68)">
    <path d="M 20 35 C 45 35, 55 50, 75 60 C 95 70, 105 60, 105 60"
          stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 20 85 C 45 85, 55 70, 75 60 C 95 50, 105 60, 105 60"
          stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="105" cy="60" r="11" fill="#00D9FF"/>
    <circle cx="105" cy="60" r="5"  fill="#FFFFFF"/>
    <circle cx="20"  cy="35" r="5"  fill="#FFFFFF"/>
    <circle cx="20"  cy="85" r="5"  fill="#94a3b8"/>
  </g>

  <!-- Wordmark — two separate text elements, no tspan -->
  <text x="220" y="142"
        font-family="Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="#FFFFFF">Chain</text>
  <text x="354" y="142"
        font-family="Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="#00D9FF">More</text>

  <!-- Eyebrow -->
  <text x="70" y="280"
        font-family="Menlo, Monaco, monospace"
        font-size="22" font-weight="600" fill="#00D9FF"
        letter-spacing="3">CROSS-RAIL PAYMENT ORCHESTRATION</text>

  <!-- Main headline — two separate text elements, NOT tspans -->
  <text x="70" y="380"
        font-family="Helvetica, Arial, sans-serif"
        font-size="70" font-weight="700" fill="#FFFFFF">Web3 payments,</text>
  <text x="70" y="470"
        font-family="Helvetica, Arial, sans-serif"
        font-size="70" font-weight="700" fill="#FFFFFF">Web2 checkout.</text>

  <!-- Bottom strip -->
  <text x="70" y="592"
        font-family="Menlo, Monaco, monospace"
        font-size="20" fill="#94a3b8">chainmore.io</text>
  <text x="1130" y="592" text-anchor="end"
        font-family="Helvetica, Arial, sans-serif"
        font-size="18" fill="#64748b">Chainmore OÜ · Tallinn, Estonia</text>
</svg>
